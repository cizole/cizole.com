<style>
  .page { max-width: 1100px; margin: 0 auto; padding: 56px 16px 24px; }
  .stage { width: min(100%, calc((100dvh - 210px) * 1.6)); min-width: min(100%, 300px); margin: 0 auto; }

  #room {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 10px;
    background: #000;
    touch-action: none; /* the walls are the drawing surface */
    user-select: none;
    -webkit-user-select: none;
    cursor: crosshair;
    --fluo: 0;
  }
  #room .marker { font-family: "Permanent Marker", cursive; }
  #room .mono { font-family: "Space Mono", ui-monospace, Consolas, monospace; }

  /* ---------- lighting ---------- */
  #shade { pointer-events: none; fill: #1a0f05; opacity: 0.38; transition: fill 0.25s, opacity 0.25s; }
  #room.m-uv #shade { fill: #0a0418; opacity: 0.9; }
  #room.m-both #shade { fill: #140a14; opacity: 0.32; }
  #room.m-dark #shade { fill: #000; opacity: 0.965; }

  .lamp-light, .uv-light { pointer-events: none; opacity: 0; transition: opacity 0.25s; }
  #room.m-normal .lamp-light, #room.m-both .lamp-light { opacity: 1; }
  #room.m-uv .uv-light, #room.m-both .uv-light { opacity: 1; }
  .screen { mix-blend-mode: screen; }

  #fluo { pointer-events: none; opacity: var(--fluo); transition: opacity 0.25s; }
  #room.m-uv { --fluo: 1; }
  #room.m-both { --fluo: 0.22; }
  #phos { pointer-events: none; opacity: 0; }
  .lava { pointer-events: none; }

  /* the starter stutter should be crisp, not faded */
  #room.flickering #shade, #room.flickering .lamp-light, #room.flickering .uv-light, #room.flickering #fluo { transition: none; }

  #switchplate { cursor: pointer; }

  /* ---------- lava lamp ---------- */
  .wax {
    transform-box: fill-box;
    transform-origin: center;
    animation: rise var(--d, 9s) ease-in-out infinite alternate;
    animation-delay: var(--dl, 0s);
  }
  @keyframes rise {
    from { transform: translateY(0) scale(1, 1); }
    to { transform: translateY(-96px) scale(0.82, 1.18); }
  }

  /* ---------- ink ---------- */
  .ink-trace { fill: none; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; opacity: 0.07; }
  .ink-glow { fill: none; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; opacity: 0.95; }

  /* ---------- controls ---------- */
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 14px; font-size: 14px; color: var(--dim); }
  .controls button {
    padding: 6px 12px;
    border: 1px solid #3a372f;
    border-radius: 999px;
    background: #1a1916;
    color: var(--fg);
    font: 14px var(--font);
    cursor: pointer;
  }
  .controls button:hover { border-color: #6a6458; }
  .controls button.on { border-color: #8a3dff; color: #d9b8ff; box-shadow: 0 0 10px rgba(138, 61, 255, 0.35); }
  .controls button.lamp.on { border-color: #b8913e; color: #ffe2a0; box-shadow: 0 0 10px rgba(255, 207, 135, 0.25); }
  .pens { display: inline-flex; align-items: center; gap: 8px; }
  .controls .pen {
    width: 22px;
    height: 22px;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 50%;
    background: var(--c);
    box-shadow: none;
  }
  .controls .pen.picked { border-color: var(--fg); box-shadow: 0 0 10px var(--c); }
  .caption { min-height: 1.5em; margin: 12px 0 0; font-size: 15px; transition: opacity 0.25s; }
  .caption.fade { opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    .wax { animation-duration: calc(var(--d, 9s) * 3); }
  }
</style>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('room');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const COLORS = ['#ff3fd0', '#7dff3a', '#ffe93a'];
  const WALL_TOP = 92;
  const WALL_BOTTOM = 703;
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  const store = {
    get(key, fallback) {
      try {
        const v = localStorage.getItem(key);
        return v === null ? fallback : JSON.parse(v);
      } catch (err) { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (err) { /* private mode or full */ }
    },
  };

  function el(tag, attrs, parent) {
    const node = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    if (parent) parent.appendChild(node);
    return node;
  }

  // ---------- caption ----------
  const captionEl = document.getElementById('caption');
  let captionTimer;
  function say(text) {
    clearTimeout(captionTimer);
    captionEl.classList.add('fade');
    captionTimer = setTimeout(() => {
      captionEl.textContent = text;
      captionEl.classList.remove('fade');
    }, 200);
  }

  // ---------- visits: the tally grows, the note changes ----------
  const visitsRaw = store.get('cizole.blacklight.visits', 0);
  const visits = (Number.isFinite(visitsRaw) ? visitsRaw : 0) + 1;
  store.set('cizole.blacklight.visits', visits);

  (() => {
    const tally = document.getElementById('tally');
    const count = Math.min(60, 16 + visits);
    for (let i = 0; i < count; i++) {
      const group = Math.floor(i / 5);
      const k = i % 5;
      const gx = 1418 + (group % 4) * 44;
      const gy = 580 + Math.floor(group / 4) * 40;
      const j = ((i * 37) % 7) - 3; // hand-drawn wobble, same every time
      if (k < 4) el('line', { x1: gx + k * 8 + j * 0.4, y1: gy + (j % 2), x2: gx + k * 8 - j * 0.3, y2: gy + 30 }, tally);
      else el('line', { x1: gx - 4, y1: gy + 26, x2: gx + 30, y2: gy + 4 }, tally);
    }

    const NOTES = [
      ["you've been here before.", 'the wall remembers.'],
      ['the stars on the ceiling', 'are not real stars.'],
      ['do not trust the fruit.'],
      ['this wall was painted', 'over twice.', "it didn't help."],
      ['check behind the couch.'],
      ['we ran out of wall.'],
      ['hi again.'],
    ];
    const lines = NOTES[(visits - 1) % NOTES.length];
    const note = document.getElementById('note');
    lines.forEach((line, i) => {
      const t = el('text', { x: 835, y: 250 + i * 26, 'font-size': 18 }, note);
      t.textContent = line;
    });
  })();

  // ---------- stickers and lint ----------
  const STARS = [
    [90, 40, 16], [210, 62, 11], [330, 30, 13], [470, 58, 10], [560, 34, 15], [760, 60, 9], [1080, 40, 12],
    [1180, 66, 10], [1380, 36, 14], [1520, 58, 12], [250, 140, 10], [1450, 160, 12], [40, 120, 9], [1560, 120, 10],
  ];
  const MOON = 'M0 -22 A22 22 0 1 0 0 22 A16 16 0 1 1 0 -22 Z';
  (() => {
    const base = document.getElementById('stars-base');
    const phos = document.getElementById('phos');
    for (const [x, y, s] of STARS) {
      const attrs = { href: '#star', x: x - s, y: y - s, width: s * 2, height: s * 2 };
      el('use', { ...attrs, fill: '#d6dcb8', opacity: 0.6 }, base);
      el('use', { ...attrs, fill: '#b6ff8f' }, phos);
    }
    el('path', { d: MOON, transform: 'translate(1270 46)', fill: '#d6dcb8', opacity: 0.6 }, base);
    el('path', { d: MOON, transform: 'translate(1270 46)', fill: '#b6ff8f' }, phos);

    const lint = document.getElementById('lint');
    for (let i = 0; i < 140; i++) {
      el('circle', {
        cx: (Math.random() * 1600).toFixed(1),
        cy: (730 + Math.random() * 265).toFixed(1),
        r: (1 + Math.random() * 1.6).toFixed(1),
        opacity: (0.35 + Math.random() * 0.65).toFixed(2),
      }, lint);
    }
  })();

  // ---------- light ----------
  let lampOn = true;
  let uvSwitch = false;
  let uvLit = false;
  let mode = 'normal';
  let flickerTimers = [];
  const seen = { uv: false, dark: false };
  let darkSince = 0;
  let starsGaveUp = false;

  const CAPTIONS = {
    normal: ['a normal room. nothing to see here.', 'lamp on. everything looks fine. it always looks fine.'],
    uv: ['the blacklight is on. everything is honest now.', 'purple. very purple.', 'the room has some things to tell you.'],
    both: ['the lamp is drowning out the blacklight. pick one.'],
    dark: ['dark. the stars on the ceiling are doing their best.'],
  };

  function applyLight() {
    mode = lampOn && uvLit ? 'both' : lampOn ? 'normal' : uvLit ? 'uv' : 'dark';
    svg.classList.remove('m-normal', 'm-uv', 'm-both', 'm-dark');
    svg.classList.add('m-' + mode);
    if (mode === 'dark') { darkSince = performance.now(); starsGaveUp = false; }
    updateHum();
  }

  function announce() {
    if (mode === 'uv' && !seen.uv) {
      seen.uv = true;
      say(strokes.length ? "oh. you've been busy." : 'oh.');
      return;
    }
    say(pick(CAPTIONS[mode]));
  }

  function syncControls() {
    const lampBtn = document.getElementById('btn-lamp');
    const uvBtn = document.getElementById('btn-uv');
    lampBtn.textContent = lampOn ? 'lamp: on' : 'lamp: off';
    lampBtn.classList.toggle('on', lampOn);
    uvBtn.textContent = uvSwitch ? 'blacklight: on' : 'blacklight: off';
    uvBtn.classList.toggle('on', uvSwitch);
    // up is on
    document.getElementById('knob-lamp').setAttribute('y', lampOn ? 432 : 452);
    document.getElementById('knob-uv').setAttribute('y', uvSwitch ? 432 : 452);
  }

  function setLamp(on) {
    lampOn = on;
    syncControls();
    applyLight();
    announce();
  }

  function setBlacklight(on) {
    uvSwitch = on;
    flickerTimers.forEach(clearTimeout);
    flickerTimers = [];
    svg.classList.remove('flickering');
    syncControls();
    if (!on || reduceMotion) {
      uvLit = on;
      applyLight();
      announce();
      return;
    }
    // a fluorescent starter: a few stutters, then steady. under 3 flashes a second.
    svg.classList.add('flickering');
    say('tink. tink. tink.');
    const steps = [[0, true], [70, false], [340, true], [400, false], [820, true], [900, false], [1180, true]];
    steps.forEach(([ms, lit], i) => {
      flickerTimers.push(setTimeout(() => {
        uvLit = lit;
        applyLight();
        tick();
        if (i === steps.length - 1) {
          svg.classList.remove('flickering');
          announce();
        }
      }, ms));
    });
  }

  document.getElementById('btn-lamp').addEventListener('click', () => setLamp(!lampOn));
  document.getElementById('btn-uv').addEventListener('click', () => setBlacklight(!uvSwitch));

  // ---------- hum (optional, only after a click) ----------
  let audio = null;
  let humOn = false;
  const humBtn = document.getElementById('hum');
  function initAudio() {
    const ctx = new AudioContext();
    const master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 600;
    lp.connect(master);
    const buzz = ctx.createOscillator();
    buzz.type = 'sawtooth';
    buzz.frequency.value = 120;
    const buzzGain = ctx.createGain();
    buzzGain.gain.value = 0.5;
    buzz.connect(buzzGain).connect(lp);
    const low = ctx.createOscillator();
    low.frequency.value = 60;
    const lowGain = ctx.createGain();
    lowGain.gain.value = 0.6;
    low.connect(lowGain).connect(lp);
    buzz.start();
    low.start();
    return { ctx, master };
  }
  function updateHum() {
    if (!audio) return;
    audio.master.gain.setTargetAtTime(humOn && uvLit ? 0.05 : 0, audio.ctx.currentTime, 0.015);
  }
  function tick() {
    if (!audio || !humOn) return;
    const t = audio.ctx.currentTime;
    const o = audio.ctx.createOscillator();
    o.type = 'square';
    o.frequency.value = 2200;
    const g = audio.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.05, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
    o.connect(g).connect(audio.ctx.destination);
    o.start(t);
    o.stop(t + 0.04);
  }
  humBtn.addEventListener('click', () => {
    if (!audio) {
      try { audio = initAudio(); } catch (err) {
        humBtn.textContent = 'hum: unavailable';
        humBtn.disabled = true;
        return;
      }
    }
    humOn = !humOn;
    if (humOn) audio.ctx.resume(); // not awaited: never block on the browser
    humBtn.textContent = humOn ? 'hum: on' : 'hum: off';
    humBtn.classList.toggle('on', humOn);
    updateHum();
  });

  // ---------- your highlighter ----------
  const STROKES_KEY = 'cizole.blacklight.strokes';
  const MAX_POINTS = 5000;
  const traceG = document.getElementById('trace-strokes');
  const glowG = document.getElementById('glow-strokes');
  let pen = 0;
  let strokes = [];
  let rendered = [];
  let drawing = null;
  let drawingNodes = null;
  let drewOnce = false;

  const validStroke = s => s && Number.isInteger(s.c) && s.c >= 0 && s.c < COLORS.length &&
    Array.isArray(s.p) && s.p.length >= 2 && s.p.length % 2 === 0 && s.p.every(Number.isFinite);

  function pathD(p) {
    let d = `M${p[0]} ${p[1]}`;
    for (let i = 2; i < p.length; i += 2) d += `L${p[i]} ${p[i + 1]}`;
    if (p.length === 2) d += 'l0.1 0'; // a single tap still leaves a dot
    return d;
  }
  function renderStroke(s) {
    const d = pathD(s.p);
    return {
      trace: el('path', { d, stroke: COLORS[s.c], class: 'ink-trace' }, traceG),
      glow: el('path', { d, stroke: COLORS[s.c], class: 'ink-glow' }, glowG),
    };
  }
  const pointCount = () => strokes.reduce((n, s) => n + s.p.length / 2, 0);
  function enforceCap() {
    let total = pointCount();
    while (total > MAX_POINTS && strokes.length > 1) {
      const old = strokes.shift();
      const nodes = rendered.shift();
      nodes.trace.remove();
      nodes.glow.remove();
      total -= old.p.length / 2;
    }
  }

  const loaded = store.get(STROKES_KEY, []);
  strokes = Array.isArray(loaded) ? loaded.filter(validStroke) : [];
  rendered = strokes.map(renderStroke);
  enforceCap();

  function toRoom(e) {
    const m = svg.getScreenCTM();
    if (!m) return null;
    const pt = svg.createSVGPoint();
    pt.x = e.clientX;
    pt.y = e.clientY;
    const p = pt.matrixTransform(m.inverse());
    return { x: p.x, y: p.y };
  }

  let pointer = null;
  svg.addEventListener('pointerdown', e => {
    const p = toRoom(e);
    if (!p) return;
    if (e.target.closest('#switchplate')) {
      if (p.x < 1490) setLamp(!lampOn);
      else setBlacklight(!uvSwitch);
      return;
    }
    if (p.y < WALL_TOP || p.y > WALL_BOTTOM) return;
    e.preventDefault();
    drawing = { c: pen, p: [Math.round(p.x), Math.round(p.y)] };
    drawingNodes = renderStroke(drawing);
    try { svg.setPointerCapture(e.pointerId); } catch (err) { /* synthetic pointer */ }
    if (!drewOnce) {
      drewOnce = true;
      if (mode === 'normal') say("you're drawing with invisible ink. you might want to check your work.");
      else if (mode === 'uv') say('the landlord will not be thrilled.');
      else if (mode === 'dark') say("you're drawing in the dark. bold.");
    }
  });

  svg.addEventListener('pointermove', e => {
    const p = toRoom(e);
    if (!p) return;
    pointer = p;
    if (!drawing) return;
    const pts = drawing.p;
    const lx = pts[pts.length - 2];
    const ly = pts[pts.length - 1];
    const x = Math.round(p.x);
    const y = Math.round(p.y);
    if (Math.hypot(x - lx, y - ly) < 4 || pts.length / 2 >= MAX_POINTS) return;
    pts.push(x, y);
    const d = pathD(pts);
    drawingNodes.trace.setAttribute('d', d);
    drawingNodes.glow.setAttribute('d', d);
  });

  function endStroke() {
    if (!drawing) return;
    strokes.push(drawing);
    rendered.push(drawingNodes);
    drawing = null;
    drawingNodes = null;
    enforceCap();
    store.set(STROKES_KEY, strokes);
  }
  svg.addEventListener('pointerup', endStroke);
  svg.addEventListener('pointercancel', endStroke);
  svg.addEventListener('pointerleave', () => { if (!drawing) pointer = null; });

  document.querySelectorAll('.pen').forEach(btn => {
    btn.addEventListener('click', () => {
      pen = Number(btn.dataset.pen);
      document.querySelectorAll('.pen').forEach(b => b.classList.toggle('picked', b === btn));
    });
  });

  document.getElementById('scrub').addEventListener('click', () => {
    if (!strokes.length) {
      say("there's nothing of yours to scrub. the old graffiti doesn't come off.");
      return;
    }
    rendered.forEach(n => { n.trace.remove(); n.glow.remove(); });
    strokes = [];
    rendered = [];
    store.set(STROKES_KEY, strokes);
    say("scrubbed. your part, anyway. the old graffiti has been there since 2009.");
  });

  // ---------- the loop: phosphorescence, and the fruit ----------
  const eyes = [
    { cx: 660, cy: 360, x: 0, y: 0, el: document.getElementById('pupil-l') },
    { cx: 740, cy: 360, x: 0, y: 0, el: document.getElementById('pupil-r') },
  ];
  let charge = 0.6; // the stickers have been under the lamp all day
  const phosEl = document.getElementById('phos');
  let shownPhos = -1;
  let fruitNoticed = false;
  let last = performance.now();

  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;

    // stickers charge under any light and fade slowly in the dark
    if (lampOn || uvLit) charge = Math.min(1, charge + dt * (uvLit ? 0.8 : 0.35));
    else charge *= Math.exp(-dt / 9);
    const visible = lampOn ? charge * 0.1 : uvLit ? Math.max(0.85, charge) : charge;
    if (Math.abs(visible - shownPhos) > 0.003) {
      shownPhos = visible;
      phosEl.style.opacity = visible.toFixed(3);
    }
    if (mode === 'dark' && !starsGaveUp && charge < 0.05 && now - darkSince > 5000) {
      starsGaveUp = true;
      say('the stars have given up. so has the room.');
    }

    // the fruit only watches you under the blacklight
    const watching = mode === 'uv' && pointer;
    for (const eye of eyes) {
      let tx = 0;
      let ty = 0;
      if (watching) {
        const dx = pointer.x - eye.cx;
        const dy = pointer.y - eye.cy;
        const dist = Math.hypot(dx, dy) || 1;
        const reach = Math.min(9, dist / 14);
        tx = (dx / dist) * reach;
        ty = (dy / dist) * reach;
      }
      const nx = eye.x + (tx - eye.x) * 0.2;
      const ny = eye.y + (ty - eye.y) * 0.2;
      if (Math.abs(nx - eye.x) + Math.abs(ny - eye.y) < 0.01) continue;
      eye.x = nx;
      eye.y = ny;
      eye.el.setAttribute('transform', `translate(${eye.x.toFixed(2)} ${eye.y.toFixed(2)})`);
    }
    if (watching && !fruitNoticed && pointer.x > 600 && pointer.x < 800 && pointer.y > 190 && pointer.y < 470) {
      fruitNoticed = true;
      say('the fruit is looking at you.');
    }

    requestAnimationFrame(frame);
  }

  syncControls();
  applyLight();
  say(CAPTIONS.normal[0]);
  requestAnimationFrame(frame);
})();
</script>
<script src="../assets/rooms.js"></script>
<script src="../assets/away.js"></script>
</body>
