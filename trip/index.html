<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>trip · cizole</title>
<link rel="icon" href="../favicon.svg?v=2" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/site.css">
<style>
  body { overflow: hidden; background: #000; touch-action: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .words {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 0 16px;
    color: #fff;
    font-size: clamp(40px, 9vw, 120px);
    font-weight: 700;
    line-height: 1;
    text-align: center;
    mix-blend-mode: difference;
    filter: url(#melt);
    pointer-events: none;
    user-select: none;
    animation: breathe 7s ease-in-out infinite alternate;
    transition: opacity 1s, filter 1s;
  }
  .words.fade { opacity: 0; }
  @keyframes breathe {
    from { letter-spacing: -0.03em; }
    to { letter-spacing: 0.09em; }
  }

  .sound {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 100;
    padding: 6px 12px;
    border: 0;
    border-radius: 999px;
    background: rgba(14, 13, 11, 0.85);
    color: var(--dim);
    font: 14px var(--font);
    cursor: pointer;
  }
  .sound:hover, .sound.on { color: var(--acid); }

  .hint {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 20px;
    margin: 0;
    color: rgba(255, 255, 255, 0.7);
    font-size: 14px;
    text-align: center;
    letter-spacing: 0.2em;
    mix-blend-mode: difference;
    pointer-events: none;
    transition: opacity 2s;
  }
  .hint.gone { opacity: 0; }

  /* no WebGL: settle for a spinning rainbow */
  body.no-gl #c { display: none; }
  body.no-gl {
    background: conic-gradient(from 0deg, #ff3dd0, #3dfff2, #f6ff3d, #ff3dd0);
    animation: hue 10s linear infinite;
  }
  @keyframes hue { to { filter: hue-rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    .words { animation: none; }
  }
</style>
</head>
<body>
<a class="lobby-link" href="../">&larr; lobby</a>
<button class="sound" id="sound" type="button">sound: off</button>
<canvas id="c" aria-hidden="true"></canvas>
<div class="words" id="words"></div>
<p class="hint" id="hint">move &middot; click &middot; scroll</p>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="melt">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="2" seed="3" result="noise">
      <animate id="melt-anim" attributeName="baseFrequency" dur="14s" values="0.012 0.03;0.022 0.055;0.012 0.03" repeatCount="indefinite"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="22" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<script id="vert" type="x-shader/x-vertex">
attribute vec2 p;
void main() { gl_Position = vec4(p, 0.0, 1.0); }
</script>

<script id="frag" type="x-shader/x-fragment">
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 uRes;
uniform float uTime;
uniform vec2 uMouse;
uniform float uSeg;
uniform float uZoom;
uniform float uPal;
uniform float uPulse;

vec3 palette(float t) {
  return 0.5 + 0.5 * cos(6.28318 * (t + vec3(0.0, 0.33, 0.67) + uPal));
}

float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
}

float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) {
    v += a * noise(p);
    p = p * 2.03 + vec2(1.7, 9.2);
    a *= 0.5;
  }
  return v;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / min(uRes.x, uRes.y);
  float vig = 1.0 - smoothstep(0.35, 1.25, length(uv));
  vec2 m = uMouse - 0.5;
  uv = (uv - m * 0.25) * uZoom;
  float t = uTime * 0.12;

  // fold the plane into a kaleidoscope
  float r = length(uv);
  float seg = 6.28318 / uSeg;
  float a = mod(atan(uv.y, uv.x) + t * 0.6 + m.x * 1.5, seg);
  a = abs(a - seg * 0.5);
  vec2 p = r * vec2(cos(a), sin(a));

  // warp noise with more noise
  vec2 q = vec2(fbm(p * 3.0 + t), fbm(p * 3.0 - t + 4.0));
  vec2 w = vec2(fbm(p * 2.0 + 4.0 * q + vec2(1.7, 9.2) + t * 1.3),
                fbm(p * 2.0 + 4.0 * q + vec2(8.3, 2.8) - t));
  float f = fbm(p * 2.5 + 3.0 * w + m.y * 2.0);

  float rings = 0.5 + 0.5 * sin(r * 16.0 - uTime * 1.1 + f * 7.0);
  vec3 col = palette(f * 1.5 + r * 0.5 + uTime * 0.04);
  col = mix(col, palette(f + 0.5 + uTime * 0.04), rings * 0.4);
  col *= 0.6 + 0.6 * f;
  col += uPulse * 0.35 * palette(r * 3.0 - uTime);
  col *= mix(0.25, 1.0, vig);
  gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const hint = document.getElementById('hint');
const hideHint = () => hint.classList.add('gone');
setTimeout(hideHint, 6000);

// Floating words that melt and swap every few seconds.
(() => {
  const PHRASES = [
    'everything is fine',
    'you are a pattern',
    'the walls are breathing',
    'colors have flavors now',
    'this is the inside of a thought',
    "you've been here before",
    'relax your eyes',
    "it's all just math",
    'blink if you can hear this',
    'hello from the other side of the screen',
  ];
  // the longer you stare, the more it's about you
  const LATER = [
    "you've been staring for a while",
    'the walls have not stopped breathing',
    'it noticed you',
    'blink. you forgot to',
    'this is fine. probably',
    'you can leave. it will keep going',
    "it's still going when the tab is closed. don't check",
    'the colors know your name now',
  ];
  const el = document.getElementById('words');
  const started = performance.now();
  let stared = 0; // seconds with the tab visible
  setInterval(() => { if (!document.hidden) stared++; }, 1000);
  let i = Math.floor(Math.random() * PHRASES.length);
  let j = 0;
  el.textContent = PHRASES[i];
  if (reduceMotion) document.getElementById('melt-anim').remove();
  setInterval(() => {
    el.classList.add('fade');
    setTimeout(() => {
      let text;
      if (stared > 90 && Math.random() < Math.min(0.8, (stared - 90) / 240)) {
        text = LATER[j++ % LATER.length];
        if (stared > 240 && j % 4 === 0) text = `${Math.floor(stared / 60)} minutes. the mountain is still out there`;
      } else {
        i = (i + 1) % PHRASES.length;
        text = PHRASES[i];
      }
      el.textContent = text;
      el.classList.remove('fade');
    }, 1000);
  }, 5500);
  addEventListener('cizole:return', e => {
    if (e.detail.awayMs > 4000) {
      el.classList.add('fade');
      setTimeout(() => { el.textContent = 'it kept going. told you'; el.classList.remove('fade'); }, 400);
    }
  });
})();

// Optional drone. Browsers only allow audio after a click, hence the button.
const drone = (() => {
  const btn = document.getElementById('sound');
  let a = null;
  let on = false;

  function build() {
    const ctx = new AudioContext();
    const master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 500;
    filter.Q.value = 7;
    filter.connect(master);
    const oscs = [55, 55.3, 82.4, 110.6].map((f, i) => {
      const o = ctx.createOscillator();
      o.type = i % 2 ? 'sawtooth' : 'triangle';
      o.frequency.value = f;
      const g = ctx.createGain();
      g.gain.value = 0.22;
      o.connect(g).connect(filter);
      o.start();
      return o;
    });
    // slow wah on the filter
    const lfo = ctx.createOscillator();
    lfo.frequency.value = 0.07;
    const depth = ctx.createGain();
    depth.gain.value = 350;
    lfo.connect(depth).connect(filter.frequency);
    lfo.start();
    return { ctx, master, filter, oscs };
  }

  btn.addEventListener('click', async () => {
    on = !on;
    btn.textContent = on ? 'sound: on' : 'sound: off';
    btn.classList.toggle('on', on);
    if (!a) a = build();
    const now = a.ctx.currentTime;
    if (on) {
      await a.ctx.resume();
      a.master.gain.cancelScheduledValues(now);
      a.master.gain.setTargetAtTime(0.16, now, 0.8);
    } else {
      a.master.gain.cancelScheduledValues(now);
      a.master.gain.setTargetAtTime(0, now, 0.3);
    }
  });

  return {
    steer(x, y) {
      if (!on || !a) return;
      const now = a.ctx.currentTime;
      a.filter.frequency.setTargetAtTime(220 + x * 1400, now, 0.15);
      a.oscs.forEach((o, i) => o.detune.setTargetAtTime((y - 0.5) * 40 * (i + 1), now, 0.2));
    },
    bloop() {
      if (!on || !a) return;
      const now = a.ctx.currentTime;
      const o = a.ctx.createOscillator();
      const g = a.ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(900 + Math.random() * 400, now);
      o.frequency.exponentialRampToValueAtTime(140, now + 0.6);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.25, now + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);
      o.connect(g).connect(a.master);
      o.start(now);
      o.stop(now + 0.75);
    },
  };
})();

// The kaleidoscope.
(() => {
  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl', { antialias: false, powerPreference: 'high-performance' });
  if (!gl) { document.body.classList.add('no-gl'); return; }

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }

  let prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, document.getElementById('vert').textContent));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('frag').textContent));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  } catch (err) {
    console.error(err);
    document.body.classList.add('no-gl');
    return;
  }
  gl.useProgram(prog);

  // one oversized triangle covers the screen
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const U = {};
  for (const n of ['uRes', 'uTime', 'uMouse', 'uSeg', 'uZoom', 'uPal', 'uPulse']) U[n] = gl.getUniformLocation(prog, n);

  // render below native resolution: it's blurry anyway, and much cheaper
  const QUALITY = 0.6;
  function resize() {
    const scale = Math.min(devicePixelRatio || 1, 2) * QUALITY;
    canvas.width = Math.round(innerWidth * scale);
    canvas.height = Math.round(innerHeight * scale);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  addEventListener('resize', resize);
  resize();

  const SEGMENTS = [6, 8, 5, 12, 7, 3, 10];
  let segIdx = 0;
  let tx = 0.5, ty = 0.5, mx = 0.5, my = 0.5;
  let zoom = 1, zoomTarget = 1;
  let pal = 0, palTarget = 0;
  let pulse = 0;
  let lastShift = 0;

  function point(e) {
    tx = e.clientX / innerWidth;
    ty = 1 - e.clientY / innerHeight;
  }

  function shift() {
    const now = performance.now();
    if (now - lastShift < 250) return;
    lastShift = now;
    segIdx = (segIdx + 1) % SEGMENTS.length;
    palTarget += 0.15 + Math.random() * 0.3;
    pulse = 1;
    drone.bloop();
    hideHint();
  }

  addEventListener('pointermove', point);
  addEventListener('pointerdown', e => {
    if (e.target.closest('a, button')) return;
    point(e);
    shift();
  });
  addEventListener('keydown', e => {
    if (e.code === 'Space' && !e.target.closest('button, a')) { e.preventDefault(); shift(); }
  });
  addEventListener('wheel', e => {
    e.preventDefault();
    zoomTarget = Math.min(5, Math.max(0.25, zoomTarget * Math.exp(e.deltaY * 0.0012)));
    hideHint();
  }, { passive: false });

  let last = performance.now();
  let t = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    t += dt * (reduceMotion ? 0.25 : 1);
    mx += (tx - mx) * 0.05;
    my += (ty - my) * 0.05;
    zoom += (zoomTarget - zoom) * 0.08;
    pal += (palTarget - pal) * 0.05;
    pulse *= Math.pow(0.03, dt);
    drone.steer(mx, my);

    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform1f(U.uTime, t);
    gl.uniform2f(U.uMouse, mx, my);
    gl.uniform1f(U.uSeg, SEGMENTS[segIdx]);
    gl.uniform1f(U.uZoom, zoom);
    gl.uniform1f(U.uPal, pal);
    gl.uniform1f(U.uPulse, pulse);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
<script src="../assets/rooms.js"></script>
<script src="../assets/away.js"></script>
</body>
</html>
