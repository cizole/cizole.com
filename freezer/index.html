<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>freezer · cizole</title>
<link rel="icon" href="../favicon.svg?v=2" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/site.css">
<style>
  :root {
    --c: 0; /* how cold it has gotten, 0 to 1 */
    --steel: #a9b3bc;
    --steel-dark: #6f7a84;
    --ice: #e8f4fc;
  }
  .page {
    --w: max(300px, min(calc(100vw - 32px), calc((100dvh - 170px) * 1.6), 1150px));
    padding: 56px 16px 24px;
    /* the longer you stay, the less color there is */
    filter: saturate(calc(1 - var(--c) * 0.6)) brightness(calc(1 - var(--c) * 0.06));
  }
  .stage-wrap { width: var(--w); margin: 0 auto; }
  .stage {
    position: relative;
    width: var(--w);
    height: calc(var(--w) / 1.6);
    overflow: hidden;
    border-radius: 10px;
    background: #8d98a3;
    container-type: size;
    user-select: none;
  }
  .stage.thud { animation: thud 0.28s ease-out; }
  @keyframes thud {
    30% { transform: translate(0.12cqw, 0.2cqw); }
    60% { transform: translate(-0.08cqw, -0.1cqw); }
  }
  .marker { font-family: "Permanent Marker", cursive; }

  .obj {
    position: absolute;
    padding: 0;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  .obj:focus-visible, .knob:focus-visible { outline: 2px solid var(--acid); outline-offset: 2px; }
  .obj svg { display: block; width: 100%; height: 100%; overflow: visible; }

  /* ---------- the box itself ---------- */
  .walls {
    position: absolute;
    inset: 0 0 22% 0;
    background:
      radial-gradient(circle, #e3e8ec 0 0.18cqw, #66717c 0.24cqw, transparent 0.3cqw) -8cqw 1.4cqw / 16cqw 5cqw,
      repeating-linear-gradient(90deg, transparent 0 15.85cqw, rgba(0, 0, 0, 0.28) 15.85cqw 16cqw, rgba(255, 255, 255, 0.3) 16cqw 16.12cqw),
      repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.05) 0 0.09cqw, rgba(0, 0, 0, 0.045) 0.09cqw 0.21cqw),
      linear-gradient(180deg, #7d8893 0%, #bac4cc 30%, #aab4bd 62%, #87929c 100%);
  }
  .walls::after {
    /* frost where the wall meets the floor */
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -0.6cqw;
    height: 2.2cqw;
    background: radial-gradient(ellipse at 50% 100%, rgba(240, 248, 255, 0.8), rgba(240, 248, 255, 0) 70%);
    filter: blur(0.3cqw);
  }
  .ceiling {
    position: absolute;
    inset: 0 0 auto 0;
    z-index: 2;
    height: 6%;
    background: linear-gradient(#58626b, #75808a);
    box-shadow: 0 0.3cqw 0.6cqw rgba(0, 0, 0, 0.25), inset 0 -0.25cqw 0 rgba(236, 246, 255, 0.55);
  }
  .floor {
    position: absolute;
    inset: 78% 0 0 0;
    border-top: 0.45cqw solid #a2adb6;
    background:
      repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.09) 0 0.3cqw, transparent 0.3cqw 2cqw),
      repeating-linear-gradient(-45deg, rgba(0, 0, 0, 0.13) 0 0.3cqw, transparent 0.3cqw 2cqw),
      linear-gradient(#707b85, #4f5962);
  }
  .glow {
    position: absolute;
    left: 27.2%;
    top: 16%;
    z-index: 1;
    width: 70cqw;
    height: 70cqw;
    margin: -35cqw 0 0 -35cqw;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 246, 225, 0.32), rgba(255, 246, 225, 0.08) 35%, transparent 65%);
    pointer-events: none;
    transition: opacity 0.08s;
  }
  .glow.flicker { opacity: 0.35; }

  .fog {
    position: absolute;
    left: -12%;
    right: -12%;
    bottom: -3%;
    z-index: 20;
    height: 27%;
    pointer-events: none;
    background:
      radial-gradient(ellipse 22% 55% at 18% 72%, rgba(236, 243, 249, 0.6), transparent 70%),
      radial-gradient(ellipse 26% 50% at 48% 82%, rgba(236, 243, 249, 0.55), transparent 70%),
      radial-gradient(ellipse 24% 58% at 80% 68%, rgba(236, 243, 249, 0.5), transparent 70%);
    filter: blur(0.7cqw);
    animation: drift 19s ease-in-out infinite alternate;
  }
  .fog.b {
    height: 20%;
    opacity: 0.8;
    background:
      radial-gradient(ellipse 20% 60% at 30% 80%, rgba(236, 243, 249, 0.55), transparent 70%),
      radial-gradient(ellipse 25% 55% at 68% 76%, rgba(236, 243, 249, 0.5), transparent 70%);
    animation-duration: 24s;
    animation-direction: alternate-reverse;
  }
  @keyframes drift { to { transform: translateX(7%); } }

  /* ---------- the caged bulb ---------- */
  .bulb { left: 25%; top: 5.5%; z-index: 8; width: 4.4cqw; height: 14%; }

  /* ---------- the evaporator fan ---------- */
  .fan {
    left: 61%;
    top: 1.2%;
    z-index: 6;
    width: 30%;
    height: 11%;
    border-radius: 0.4cqw;
    background:
      repeating-linear-gradient(180deg, rgba(0, 0, 0, 0.12) 0 0.18cqw, transparent 0.18cqw 0.7cqw),
      linear-gradient(#cfd6dc, #9aa4ad);
    box-shadow: 0 0.5cqw 1cqw rgba(0, 0, 0, 0.3), inset 0 0.3cqw 0 rgba(245, 250, 255, 0.85);
  }
  .grille {
    position: absolute;
    top: 50%;
    width: 5.6cqw;
    height: 5.6cqw;
    margin-top: -2.8cqw;
    overflow: hidden;
    border-radius: 50%;
    background: #2a3037;
    box-shadow: 0 0 0 0.3cqw #7c8791;
  }
  .grille.a { left: 18%; }
  .grille.b { left: 58%; }
  .blades {
    position: absolute;
    inset: 8%;
    border-radius: 50%;
    background: conic-gradient(#56616b 0 22deg, transparent 22deg 90deg, #56616b 90deg 112deg, transparent 112deg 180deg, #56616b 180deg 202deg, transparent 202deg 270deg, #56616b 270deg 292deg, transparent 292deg);
    animation: spin 0.45s linear infinite;
  }
  .grille::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: repeating-radial-gradient(circle, transparent 0 0.45cqw, rgba(200, 208, 215, 0.85) 0.45cqw 0.56cqw);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .icicles {
    position: absolute;
    left: 4%;
    right: 4%;
    top: 100%;
    height: 1.6cqw;
    background: linear-gradient(rgba(240, 248, 255, 0.95), rgba(214, 234, 248, 0.7));
    clip-path: polygon(0 0, 100% 0, 97% 40%, 95% 0, 90% 90%, 86% 0, 78% 55%, 72% 0, 60% 100%, 55% 0, 44% 45%, 38% 0, 30% 80%, 25% 0, 16% 50%, 11% 0, 6% 70%, 2% 0);
  }
  .air {
    position: absolute;
    top: 13%;
    z-index: 5;
    width: 0.15cqw;
    height: 9cqw;
    background: linear-gradient(rgba(240, 248, 255, 0), rgba(240, 248, 255, 0.45), rgba(240, 248, 255, 0));
    transform: rotate(28deg);
    opacity: 0;
    pointer-events: none;
    animation: blow 2.6s linear infinite;
  }
  @keyframes blow {
    0% { opacity: 0; translate: 0 0; }
    25% { opacity: 1; }
    100% { opacity: 0; translate: -5cqw 9cqw; }
  }

  /* ---------- the wire shelves ---------- */
  .shelves { position: absolute; left: 3%; top: 13%; z-index: 3; width: 40%; height: 75%; pointer-events: none; }
  .post {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 0.7cqw;
    background: linear-gradient(90deg, #7d8791, #eef2f5 45%, #8e98a1);
    box-shadow: 0 0 0.3cqw rgba(0, 0, 0, 0.3);
  }
  .post.l { left: 0; }
  .post.r { right: 0; }
  .rack {
    position: absolute;
    left: -0.5cqw;
    right: -0.5cqw;
    height: 2.2cqw;
    background:
      linear-gradient(#f3f6f8, #9ea8b1) 0 0 / 100% 0.6cqw no-repeat,
      repeating-linear-gradient(90deg, rgba(205, 212, 218, 0.95) 0 0.18cqw, transparent 0.18cqw 1.1cqw) 0 0.6cqw / 100% 1.2cqw no-repeat,
      linear-gradient(#c6cdd3, #c6cdd3) 0 1.8cqw / 100% 0.3cqw no-repeat;
    box-shadow: 0 -0.25cqw 0.35cqw rgba(245, 250, 255, 0.55);
  }
  .rack.r1 { top: 28%; }
  .rack.r2 { top: 57.3%; }
  .rack.r3 { top: 86.7%; }

  .item { z-index: 4; transition: transform 0.15s; }
  .item:hover { transform: translateY(-0.25cqw); }
  .peas { left: 5.5%; bottom: 66%; width: 8.5cqw; height: 9cqw; }
  .icecream { left: 16%; bottom: 66%; width: 8cqw; height: 9cqw; }
  .trays { left: 27%; bottom: 66%; width: 12cqw; height: 4.6cqw; }
  .turkey { left: 5%; bottom: 44%; width: 12cqw; height: 10cqw; }
  .container { left: 19.5%; bottom: 44%; width: 7cqw; height: 7cqw; }
  .popsicle { left: 31%; bottom: 44%; width: 4cqw; height: 9cqw; }
  .popsicle.tug { animation: tug 0.5s ease-in-out; }
  @keyframes tug {
    20%, 60% { transform: translate(0.3cqw, -0.25cqw) rotate(4deg); }
    40%, 80% { transform: translate(-0.1cqw, 0) rotate(-2deg); }
  }
  .icebag { left: 5%; bottom: 22%; width: 11cqw; height: 10cqw; }
  .cake { left: 19%; bottom: 22%; width: 16cqw; height: 10cqw; }
  .icecream .ruin { display: none; }
  .icecream.ruined .ruin { display: inline; }
  .icecream.ruined .lid { transform: rotate(-7deg) translate(-2px, -3px); transform-origin: 40px 14px; }

  /* ---------- the thermometer and the log ---------- */
  .thermo { left: 46%; top: 12%; z-index: 4; width: 8cqw; height: 12.5cqw; }
  .log {
    left: 47%;
    top: 44%;
    z-index: 4;
    width: 6.6cqw;
    height: 9.4cqw;
    padding: 1.3cqw 0.5cqw 0.4cqw;
    border-radius: 0.3cqw;
    background: #7a5a3a;
    box-shadow: 0 0.3cqw 0.6cqw rgba(0, 0, 0, 0.3);
    text-align: left;
    transform: rotate(-2deg);
  }
  .log::before {
    content: "";
    position: absolute;
    left: 30%;
    right: 30%;
    top: 0.2cqw;
    height: 0.9cqw;
    border-radius: 0.2cqw;
    background: linear-gradient(#d9dde1, #8c959d);
  }
  .log .paper {
    display: block;
    height: 100%;
    padding: 0.35cqw 0.4cqw;
    background: #f4f1e8;
    color: #3a3a3a;
    font-size: 0.62cqw;
    line-height: 1.35;
    white-space: pre;
    overflow: hidden;
  }
  .log .paper b { display: block; margin-bottom: 0.2cqw; font-size: 0.7cqw; }

  /* ---------- the door ---------- */
  .doorframe {
    position: absolute;
    left: 58%;
    top: 13%;
    z-index: 3;
    width: 36%;
    height: 72%;
    border: 1.2cqw solid #59636c;
    border-bottom: 0;
    border-radius: 0.4cqw 0.4cqw 0 0;
    background: #30363c;
    box-shadow: inset 0 0 0 0.3cqw #3d454c, 0 0.6cqw 1.2cqw rgba(0, 0, 0, 0.35);
    perspective: 90cqw;
  }
  .beyond {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background:
      linear-gradient(180deg, transparent 72%, #6b5b48 72%),
      radial-gradient(ellipse at 50% 18%, #f1dfb8, #b39a74 45%, #5e4d3a);
  }
  .beyond[data-view="sauna"] {
    background:
      linear-gradient(180deg, transparent 74%, #6e3d1d 74%),
      repeating-linear-gradient(180deg, #c07a3e 0 2.2cqw, #a8652e 2.2cqw 2.35cqw),
      #c07a3e;
  }
  .beyond[data-view="sauna"]::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 60%, rgba(255, 170, 80, 0.55), transparent 70%);
  }
  .steam {
    position: absolute;
    bottom: 10%;
    width: 9cqw;
    height: 9cqw;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.6), transparent 65%);
    filter: blur(0.6cqw);
    opacity: 0;
  }
  .beyond[data-view="sauna"] .steam { animation: rise 3.2s ease-out infinite; }
  .steam:nth-child(1) { left: 10%; }
  .steam:nth-child(2) { left: 40%; animation-delay: -1.1s; }
  .steam:nth-child(3) { left: 66%; animation-delay: -2.2s; }
  @keyframes rise {
    0% { opacity: 0; transform: translateY(0) scale(0.6); }
    30% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-22cqw) scale(1.6); }
  }
  .leaf {
    position: absolute;
    inset: 0;
    z-index: 1;
    border: 0.5cqw solid #1e2327;
    border-radius: 0.2cqw;
    background:
      linear-gradient(180deg, transparent 22%, rgba(0, 0, 0, 0.12) 22% 23%, rgba(255, 255, 255, 0.3) 23% 23.6%, transparent 23.6% 64%, rgba(0, 0, 0, 0.12) 64% 65%, rgba(255, 255, 255, 0.3) 65% 65.6%, transparent 65.6%),
      repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.05) 0 0.09cqw, rgba(0, 0, 0, 0.04) 0.09cqw 0.21cqw),
      linear-gradient(90deg, #9aa5ae, #c9d1d8 55%, #aeb8c0);
    transform-origin: 100% 50%;
    transition: transform 0.85s cubic-bezier(0.55, 0, 0.9, 0.45);
    cursor: pointer;
  }
  .doorframe.open .leaf { transform: rotateY(72deg); transition-timing-function: cubic-bezier(0.2, 0.7, 0.3, 1); }
  .doorframe.ajar .leaf { transform: rotateY(22deg); transition-timing-function: cubic-bezier(0.2, 0.7, 0.3, 1); }
  .hinge {
    position: absolute;
    right: -0.3cqw;
    width: 5cqw;
    height: 1.6cqw;
    border-radius: 0.3cqw;
    background: linear-gradient(#5a646d, #2d3338);
  }
  .hinge.a { top: 12%; }
  .hinge.b { top: 80%; }
  .door-sign {
    position: absolute;
    left: 50%;
    top: 5%;
    width: 64%;
    padding: 0.5cqw 0;
    border-radius: 0.2cqw;
    background: #f4f4f0;
    color: #b3261e;
    font-size: 1.05cqw;
    font-weight: 700;
    line-height: 1.25;
    text-align: center;
    transform: translateX(-50%);
    box-shadow: 0 0.15cqw 0.3cqw rgba(0, 0, 0, 0.25);
  }
  .door-sign small { display: block; color: #3a3a3a; font-size: 0.8cqw; }
  .release {
    position: absolute;
    left: 7%;
    top: 40%;
    width: 7.4cqw;
    padding: 0.5cqw 0 0.4cqw;
    border-radius: 0.3cqw;
    background: repeating-linear-gradient(-45deg, #f2c230 0 0.7cqw, #222 0.7cqw 1.4cqw);
    text-align: center;
  }
  .release-label {
    display: block;
    margin: 0.4cqw 0.4cqw 0;
    padding: 0.15cqw 0;
    background: #222;
    color: #f2c230;
    font-size: 0.72cqw;
    font-weight: 700;
    line-height: 1.2;
  }
  .knob {
    display: block;
    width: 3.6cqw;
    height: 3.6cqw;
    margin: 0 auto;
    padding: 0;
    border: 0.35cqw solid #7a1410;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff7a6a, #d42a1c 45%, #8f1710);
    box-shadow: 0 0.35cqw 0 #5a0e0a, 0 0.5cqw 0.8cqw rgba(0, 0, 0, 0.4);
    cursor: pointer;
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .knob:active, .knob.pushed { transform: translateY(0.3cqw); box-shadow: 0 0.05cqw 0 #5a0e0a, 0 0.2cqw 0.4cqw rgba(0, 0, 0, 0.4); }
  .sticky {
    position: absolute;
    right: 18%;
    top: 46%;
    width: 8.4cqw;
    padding: 0.5cqw 0.6cqw;
    background: #f5e27a;
    color: #2b2b2b;
    font-size: 0.95cqw;
    line-height: 1.2;
    transform: rotate(3deg);
    box-shadow: 0 0.2cqw 0.4cqw rgba(0, 0, 0, 0.25);
  }
  .gasket-frost {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 3cqw;
    background: linear-gradient(rgba(240, 248, 255, 0), rgba(240, 248, 255, 0.75));
    pointer-events: none;
  }

  /* plastic strip curtain, hung in the doorway */
  .strips { position: absolute; inset: 0; z-index: 2; display: flex; pointer-events: none; }
  .strip {
    flex: 1;
    margin: 0 -0.25cqw;
    background: linear-gradient(90deg, rgba(220, 238, 250, 0.16), rgba(255, 255, 255, 0.42) 45%, rgba(210, 232, 246, 0.2));
    border-left: 0.08cqw solid rgba(255, 255, 255, 0.35);
    transform-origin: 50% 0;
    transition: transform 0.9s cubic-bezier(0.25, 1.6, 0.45, 1);
  }
  .strip.push { transform: rotate(var(--sw, 3deg)); transition-duration: 0.18s; }
  .doorframe.open .strip, .doorframe.ajar .strip { transform: rotate(var(--blow, 2deg)) skewX(var(--blow, 2deg)); }
  .rail {
    left: -1%;
    top: -0.2cqw;
    z-index: 3;
    width: 102%;
    height: 1.3cqw;
    border-radius: 0.2cqw;
    background: linear-gradient(#dfe5ea, #8a949d);
  }

  /* ---------- hud ---------- */
  .hud {
    width: var(--w);
    margin: 12px auto 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }
  .caption {
    margin: 0;
    min-height: 2.8em;
    padding-bottom: 4px;
    font-size: 15px;
    line-height: 1.4;
    transition: opacity 0.2s;
    /* the caption frosts over too */
    text-shadow: 0 0 calc(1px + var(--c) * 6px) rgba(205, 232, 255, calc(0.12 + var(--c) * 0.7));
    background: linear-gradient(90deg, transparent, rgba(220, 240, 255, calc(var(--c) * 0.45)), transparent) 0 100% / 100% 1px no-repeat;
  }
  .caption.fade { opacity: 0; }
  .sound {
    flex: none;
    padding: 6px 12px;
    border: 1px solid var(--faint);
    border-radius: 999px;
    background: #1a1916;
    color: var(--dim);
    font: 13px var(--font);
    cursor: pointer;
  }
  .sound.on { border-color: #9cc9ec; color: #bfe0f7; }
  .rotate-hint { display: none; width: var(--w); margin: 10px auto 0; color: var(--dim); font-size: 12px; }
  @media (orientation: portrait) and (max-width: 600px) { .rotate-hint { display: block; } }

  /* ---------- the cold, over the whole page ---------- */
  .tint {
    position: fixed;
    inset: 0;
    z-index: 88;
    background: rgba(150, 195, 255, calc(var(--c) * 0.12));
    pointer-events: none;
  }
  .chill {
    position: fixed;
    inset: 0;
    z-index: 89;
    box-shadow: inset 0 0 calc(30px + 90px * var(--c)) rgba(222, 238, 255, calc(0.06 + 0.3 * var(--c)));
    pointer-events: none;
  }
  #frost {
    position: fixed;
    inset: 0;
    z-index: 90;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .breath {
    position: fixed;
    z-index: 91;
    width: 46px;
    height: 34px;
    margin: -17px 0 0 -8px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(240, 247, 255, 0.55), rgba(240, 247, 255, 0) 70%);
    filter: blur(3px);
    pointer-events: none;
    animation: exhale 1.9s ease-out forwards;
  }
  @keyframes exhale {
    from { opacity: 0.9; transform: translate(0, 0) scale(0.35); }
    to { opacity: 0; transform: translate(var(--dx, 14px), -46px) scale(1.7); }
  }
  .drip {
    position: fixed;
    z-index: 91;
    width: 3px;
    height: 14px;
    border-radius: 0 0 3px 3px;
    background: linear-gradient(rgba(215, 236, 252, 0), rgba(215, 236, 252, 0.85));
    pointer-events: none;
    animation: drip var(--t, 3s) ease-in forwards;
  }
  .drip::after {
    content: "";
    position: absolute;
    left: -2px;
    bottom: -5px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(215, 236, 252, 0.9);
  }
  @keyframes drip {
    0% { transform: translateY(0) scaleY(0.4); opacity: 0; }
    15% { opacity: 1; }
    80% { opacity: 1; }
    100% { transform: translateY(var(--fall, 160px)) scaleY(1.6); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .blades, .fog, .air, .steam { animation: none !important; }
    .leaf, .strip { transition: none !important; }
    .stage.thud { animation: none; }
  }
</style>
</head>
<body>
<a class="lobby-link" href="../">&larr; lobby</a>

<main class="page">
  <div class="stage-wrap">
    <div class="stage" id="stage">
      <div class="walls"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const TAU = Math.PI * 2;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const stage = $('#stage');
  const captionEl = $('#caption');
  const root = document.documentElement;

  // ---------- captions ----------
  let captionTimer;
  let lastSay = 0;
  function say(text) {
    if (!text) return;
    lastSay = performance.now();
    clearTimeout(captionTimer);
    captionEl.classList.add('fade');
    captionTimer = setTimeout(() => {
      captionEl.textContent = text;
      captionEl.classList.remove('fade');
    }, 180);
  }
  // walk through the lines in order, then start over
  function cycle(lines) {
    let i = 0;
    return () => {
      const line = lines[i];
      i = (i + 1) % lines.length;
      return line;
    };
  }

  // ---------- sound: nothing is created until someone asks for it ----------
  const audio = { ctx: null, on: false, master: null };
  const soundBtn = $('#sound');

  function noiseBuffer(ctx, brown) {
    const len = ctx.sampleRate * 2;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const white = Math.random() * 2 - 1;
      if (brown) {
        last = (last + 0.02 * white) / 1.02;
        d[i] = last * 3.5;
      } else {
        d[i] = white;
      }
    }
    return buf;
  }

  function initAudio() {
    if (audio.ctx) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);

    // compressor rumble
    const rumble = ctx.createBufferSource();
    rumble.buffer = noiseBuffer(ctx, true);
    rumble.loop = true;
    const low = ctx.createBiquadFilter();
    low.type = 'lowpass';
    low.frequency.value = 260;
    const rumbleGain = ctx.createGain();
    rumbleGain.gain.value = 0.55;
    rumble.connect(low).connect(rumbleGain).connect(master);
    rumble.start();

    // mains hum
    for (const [f, g] of [[60, 0.05], [120, 0.022]]) {
      const o = ctx.createOscillator();
      o.frequency.value = f;
      const og = ctx.createGain();
      og.gain.value = g;
      o.connect(og).connect(master);
      o.start();
    }

    // the fan pushing air, breathing a little
    const air = ctx.createBufferSource();
    air.buffer = noiseBuffer(ctx, false);
    air.loop = true;
    const band = ctx.createBiquadFilter();
    band.type = 'bandpass';
    band.frequency.value = 1300;
    band.Q.value = 0.6;
    const airGain = ctx.createGain();
    airGain.gain.value = 0.035;
    const lfo = ctx.createOscillator();
    lfo.frequency.value = 0.12;
    const lfoDepth = ctx.createGain();
    lfoDepth.gain.value = 0.012;
    lfo.connect(lfoDepth).connect(airGain.gain);
    air.connect(band).connect(airGain).connect(master);
    air.start();
    lfo.start();

    audio.ctx = ctx;
    audio.master = master;
  }

  function setSound(on) {
    audio.on = on;
    soundBtn.textContent = on ? 'sound: on' : 'sound: off';
    soundBtn.classList.toggle('on', on);
    if (on) initAudio();
    if (!audio.ctx) return;
    if (on) audio.ctx.resume(); // not awaited: the ui never waits on audio
    audio.master.gain.setTargetAtTime(on ? 0.8 : 0, audio.ctx.currentTime, 0.3);
  }
  soundBtn.addEventListener('click', () => {
    setSound(!audio.on);
    if (audio.on) say('the fan is loud. the fan has always been loud. you just hear it now.');
  });

  function thudSound() {
    if (!audio.on || !audio.ctx) return;
    const ctx = audio.ctx;
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    o.frequency.setValueAtTime(90, t);
    o.frequency.exponentialRampToValueAtTime(38, t + 0.25);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.7, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
    o.connect(g).connect(audio.master);
    o.start(t);
    o.stop(t + 0.45);
  }
  function clunkSound() {
    if (!audio.on || !audio.ctx) return;
    const ctx = audio.ctx;
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    o.type = 'square';
    o.frequency.setValueAtTime(180, t);
    o.frequency.exponentialRampToValueAtTime(90, t + 0.08);
    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = 900;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.25, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    o.connect(f).connect(g).connect(audio.master);
    o.start(t);
    o.stop(t + 0.14);
  }

  document.addEventListener('visibilitychange', () => {
    if (!audio.ctx) return;
    if (document.hidden) audio.ctx.suspend();
    else if (audio.on) audio.ctx.resume();
  });

  // ---------- how cold it has gotten ----------
  // counts time actually spent looking at the freezer; full cold after four minutes
  const FULL_COLD = 240;
  let coldSeconds = 0;
  let inside = 0;
  let c = 0;
  const FG = [235, 229, 214];
  const ICY = [208, 234, 255];
  function applyCold() {
    root.style.setProperty('--c', c.toFixed(3));
    const mix = FG.map((v, i) => Math.round(v + (ICY[i] - v) * c * 0.8));
    captionEl.style.color = `rgb(${mix.join(',')})`;
  }

  // ---------- the thermometer ----------
  const needle = $('#needle');
  const ticks = $('#thermo-ticks');
  const angleFor = t => -135 + ((t + 40) / 80) * 270;
  (() => {
    const NS = 'http://www.w3.org/2000/svg';
    for (let t = -40; t <= 40; t += 5) {
      const a = (angleFor(t) - 90) * Math.PI / 180;
      const major = t % 20 === 0;
      const r1 = major ? 23 : 26;
      const line = document.createElementNS(NS, 'line');
      line.setAttribute('x1', (40 + Math.cos(a) * r1).toFixed(2));
      line.setAttribute('y1', (70 + Math.sin(a) * r1).toFixed(2));
      line.setAttribute('x2', (40 + Math.cos(a) * 30).toFixed(2));
      line.setAttribute('y2', (70 + Math.sin(a) * 30).toFixed(2));
      line.setAttribute('stroke', t <= 0 ? '#2f6fa3' : '#555');
      line.setAttribute('stroke-width', major ? 1.6 : 0.9);
      ticks.appendChild(line);
      if (major) {
        const label = document.createElementNS(NS, 'text');
        label.setAttribute('x', (40 + Math.cos(a) * 16).toFixed(2));
        label.setAttribute('y', (70 + Math.sin(a) * 16 + 2.2).toFixed(2));
        label.setAttribute('text-anchor', 'middle');
        label.setAttribute('font-size', '6');
        label.setAttribute('fill', '#444');
        label.setAttribute('font-family', 'Space Mono, monospace');
        label.textContent = t;
        ticks.appendChild(label);
      }
    }
  })();
  let temp = -10;
  let needleAngle = angleFor(-10);
  function targetTemp(now) {
    // it only goes one way. a little wobble so it looks alive
    return -10 - 9 * c + Math.sin(now / 4100) * 0.25;
  }

  // ---------- the frost, on the whole screen ----------
  const frostCanvas = $('#frost');
  const fctx = frostCanvas.getContext('2d');
  let FW = 0;
  let FH = 0;
  let tips = [];
  let spawnAcc = 0;
  function sizeFrost(force) {
    const w = innerWidth;
    const h = innerHeight;
    // phone address bars resize the window constantly; only start over when it really changes
    if (!force && Math.abs(w - FW) < 2 && Math.abs(h - FH) < 140) return;
    FW = w;
    FH = h;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    frostCanvas.width = Math.round(w * dpr);
    frostCanvas.height = Math.round(h * dpr);
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fctx.lineCap = 'round';
    tips = [];
  }
  sizeFrost(true);
  addEventListener('resize', () => sizeFrost(false));

  const edgeDist = (x, y) => Math.min(x, y, FW - x, FH - y);
  function reach() { return 22 + c * Math.min(FW, FH) * 0.24; }
  function edgePoint(depth) {
    const per = 2 * (FW + FH);
    let p = Math.random() * per;
    if (p < FW) return { x: p, y: depth, a: Math.PI / 2 };
    p -= FW;
    if (p < FH) return { x: FW - depth, y: p, a: Math.PI };
    p -= FH;
    if (p < FW) return { x: FW - p, y: FH - depth, a: -Math.PI / 2 };
    p -= FW;
    return { x: depth, y: FH - p, a: 0 };
  }
  function spawnTip(r) {
    const e = edgePoint(0);
    tips.push({
      x: e.x, y: e.y,
      a: e.a + (Math.random() - 0.5) * 1.3,
      life: r * (0.45 + Math.random() * 0.8),
      w: 0.5 + Math.random() * 0.9,
      alpha: 0.3 + Math.random() * 0.3,
      gen: 0, acc: 0,
    });
  }
  function sparkle(r) {
    const e = edgePoint(r * Math.pow(Math.random(), 1.7));
    const s = 1.5 + Math.random() * 3.5;
    const rot = Math.random() * Math.PI;
    fctx.strokeStyle = 'rgba(245, 250, 255, 0.5)';
    fctx.lineWidth = 0.6;
    fctx.beginPath();
    for (let k = 0; k < 3; k++) {
      const a = rot + (k * Math.PI) / 3;
      fctx.moveTo(e.x - Math.cos(a) * s, e.y - Math.sin(a) * s);
      fctx.lineTo(e.x + Math.cos(a) * s, e.y + Math.sin(a) * s);
    }
    fctx.stroke();
  }
  const SEG = 2.2;
  function growFrost(dt) {
    const r = reach();
    spawnAcc += dt * (0.8 + c * 7);
    while (spawnAcc >= 1) {
      spawnAcc -= 1;
      if (tips.length < 260) spawnTip(r);
    }
    if (Math.random() < dt * (0.6 + c * 3)) sparkle(r);
    const speed = 7 + c * 10; // px per second. frost is patient
    for (let i = tips.length - 1; i >= 0; i--) {
      const t = tips[i];
      t.acc += speed * dt;
      while (t.acc >= SEG && t.life > 0) {
        t.acc -= SEG;
        const nx = t.x + Math.cos(t.a) * SEG;
        const ny = t.y + Math.sin(t.a) * SEG;
        fctx.strokeStyle = `rgba(236, 246, 255, ${t.alpha.toFixed(3)})`;
        fctx.lineWidth = t.w;
        fctx.beginPath();
        fctx.moveTo(t.x, t.y);
        fctx.lineTo(nx, ny);
        fctx.stroke();
        t.x = nx;
        t.y = ny;
        t.life -= SEG;
        t.a += (Math.random() - 0.5) * 0.1;
        // ice likes sixty degrees
        if (t.gen < 4 && Math.random() < 0.08 && tips.length < 320) {
          tips.push({
            x: t.x, y: t.y,
            a: t.a + (Math.random() < 0.5 ? -1 : 1) * (Math.PI / 3),
            life: t.life * 0.5,
            w: Math.max(0.35, t.w * 0.7),
            alpha: t.alpha * 0.9,
            gen: t.gen + 1, acc: 0,
          });
        }
      }
      if (t.life <= 0 || edgeDist(t.x, t.y) > r * 1.15) tips.splice(i, 1);
    }
  }

  // wiping with the cursor. it grows back
  let wipedNearEdge = 0;
  let wipeSaid = false;
  function wipe(x0, y0, x1, y1) {
    fctx.save();
    fctx.globalCompositeOperation = 'destination-out';
    fctx.strokeStyle = '#000';
    fctx.lineWidth = 64;
    fctx.lineCap = 'round';
    fctx.beginPath();
    fctx.moveTo(x0, y0);
    fctx.lineTo(x1, y1);
    fctx.stroke();
    fctx.restore();
    if (c > 0.15 && edgeDist(x1, y1) < reach()) {
      wipedNearEdge += Math.hypot(x1 - x0, y1 - y0);
      if (!wipeSaid && wipedNearEdge > 900) {
        wipeSaid = true;
        say("you wiped the frost. it's coming back. it has nothing but time.");
      }
    }
  }

  // ---------- your breath ----------
  let nextBreath = 0;
  let puffs = 0;
  function puff(x, y) {
    if (reduceMotion || puffs > 9) return;
    const p = document.createElement('div');
    p.className = 'breath';
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.setProperty('--dx', (Math.random() * 30 - 6).toFixed(0) + 'px');
    puffs++;
    p.addEventListener('animationend', () => { p.remove(); puffs--; });
    document.body.appendChild(p);
  }

  let px = null;
  let py = null;
  addEventListener('pointermove', e => {
    const x = e.clientX;
    const y = e.clientY;
    if (px !== null) wipe(px, py, x, y);
    px = x;
    py = y;
    const now = performance.now();
    if (now > nextBreath) {
      puff(x, y);
      nextBreath = now + 650 + Math.random() * 500;
    }
  });
  addEventListener('pointerleave', () => { px = null; });
  document.documentElement.addEventListener('pointerleave', () => { px = null; });

  // ---------- melting, when someone leaves the door open ----------
  function melt() {
    coldSeconds *= 0.45;
    fctx.save();
    fctx.setTransform(1, 0, 0, 1, 0, 0);
    fctx.globalCompositeOperation = 'destination-out';
    fctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    fctx.fillRect(0, 0, frostCanvas.width, frostCanvas.height);
    fctx.restore();
    tips = [];
    const r = Math.max(40, reach());
    for (let i = 0; i < 14; i++) {
      const d = document.createElement('div');
      d.className = 'drip';
      const e = edgePoint(Math.random() * r * 0.8);
      // water runs down, so start drips along the top and the sides
      const fromTop = i < 9;
      d.style.left = (fromTop ? 20 + Math.random() * (FW - 40) : e.x) + 'px';
      d.style.top = (fromTop ? Math.random() * r * 0.6 : Math.max(20, e.y - 40)) + 'px';
      d.style.setProperty('--t', (2.4 + Math.random() * 2).toFixed(2) + 's');
      d.style.setProperty('--fall', (90 + Math.random() * 170).toFixed(0) + 'px');
      d.style.animationDelay = (Math.random() * 1.4).toFixed(2) + 's';
      d.addEventListener('animationend', () => d.remove());
      document.body.appendChild(d);
    }
  }

  // ---------- the door ----------
  const doorFrame = $('#doorframe');
  const beyond = $('#beyond');
  const knob = $('#knob');
  const strips = $('#strips');
  const STRIP_COUNT = 8;
  const stripEls = [];
  for (let i = 0; i < STRIP_COUNT; i++) {
    const s = document.createElement('span');
    s.className = 'strip';
    s.style.setProperty('--blow', ((Math.random() * 5 - 1.5)).toFixed(1) + 'deg');
    strips.appendChild(s);
    stripEls.push(s);
  }
  let lastStripX = null;
  doorFrame.addEventListener('pointermove', e => {
    const r = doorFrame.getBoundingClientRect();
    const idx = clamp(Math.floor(((e.clientX - r.left) / r.width) * STRIP_COUNT), 0, STRIP_COUNT - 1);
    const dir = lastStripX === null ? 1 : Math.sign(e.clientX - lastStripX) || 1;
    lastStripX = e.clientX;
    const s = stripEls[idx];
    s.style.setProperty('--sw', (dir * (2 + Math.random() * 3)).toFixed(1) + 'deg');
    s.classList.add('push');
    clearTimeout(s._t);
    s._t = setTimeout(() => s.classList.remove('push'), 160);
  });
  doorFrame.addEventListener('pointerleave', () => { lastStripX = null; });

  const door = { state: 'open', timer: 0 };
  function setDoor(state) {
    door.state = state;
    doorFrame.classList.toggle('open', state === 'open');
    doorFrame.classList.toggle('ajar', state === 'ajar');
  }
  function slam(line) {
    thudSound();
    if (!reduceMotion) {
      stage.classList.remove('thud');
      void stage.offsetWidth;
      stage.classList.add('thud');
    }
    if (line) say(line);
  }
  function closeDoor(line) {
    clearTimeout(door.timer);
    if (door.state === 'closed') return;
    setDoor('closed');
    door.timer = setTimeout(() => slam(line), reduceMotion ? 0 : 850);
  }
  function scheduleClose(ms, line) {
    clearTimeout(door.timer);
    door.timer = setTimeout(function tryClose() {
      // it waits for you to come back before it closes. it wants you to see
      if (document.hidden) { door.timer = setTimeout(tryClose, 1000); return; }
      closeDoor(line);
    }, ms);
  }

  knob.addEventListener('click', e => {
    e.stopPropagation();
    knob.classList.add('pushed');
    setTimeout(() => knob.classList.remove('pushed'), 160);
    clunkSound();
    if (door.state === 'open') {
      say("it's already open. the knob is just a knob now.");
      return;
    }
    // opened right here in the click, so the browser allows the new tab
    const tab = window.open('../sauna/', '_blank');
    if (tab) {
      try { tab.opener = null; } catch (err) { /* cross-origin, fine */ }
    }
    beyond.dataset.view = 'sauna';
    setDoor('open');
    say('the door opens into the sauna. of course it does.');
    if (!tab) {
      // new tab blocked: walk through the door instead
      setTimeout(() => location.assign('../sauna/'), 1600);
      return;
    }
    scheduleClose(4500, 'it closed again. they do that.');
  });

  // back from another tab: the door was open the whole time
  addEventListener('cizole:return', e => {
    if (e.detail.awayMs < 2500) return;
    melt();
    ruined = true;
    icecream.classList.add('ruined');
    if (door.state === 'closed') setDoor('ajar');
    say("you left the door open. it's warmer now. the ice cream is ruined.");
    scheduleClose(3200, null);
  });

  // ---------- the bulb ----------
  const glow = $('#glow');
  function flicker() {
    glow.classList.add('flicker');
    setTimeout(() => glow.classList.remove('flicker'), 90);
    if (Math.random() < 0.5) {
      setTimeout(() => {
        glow.classList.add('flicker');
        setTimeout(() => glow.classList.remove('flicker'), 70);
      }, 260);
    }
    setTimeout(flicker, 18000 + Math.random() * 26000);
  }
  if (!reduceMotion) setTimeout(flicker, 9000 + Math.random() * 9000);

  // ---------- things on the shelves ----------
  const icecream = $('#icecream');
  const popsicle = $('#popsicle');
  let ruined = false;
  let popsicleTugs = 0;
  const icecreamFresh = cycle([
    'a tub of ice cream. someone ate around all the chunks.',
    "the label says MINE. it doesn't say whose.",
    "it's mostly vanilla now. the chunks are gone. that was the whole point of the chunks.",
  ]);
  const icecreamRuined = cycle([
    "it's ruined. you left the door open.",
    "it's soup now. cold soup. dessert soup.",
    "it'll refreeze. it won't be the same. nothing refreezes the same.",
  ]);

  const OBJ = {
    peas: cycle([
      'frozen peas. used as an ice pack more often than as food.',
      "the label says knee. that's what they're for now.",
      'nobody remembers eating a pea.',
    ]),
    icecream: () => (ruined ? icecreamRuined() : icecreamFresh()),
    trays: cycle([
      'ice cube trays. both empty. someone put them back empty.',
      'that someone was everyone.',
    ]),
    turkey: cycle([
      'a turkey. thanksgiving 2011. still an option.',
      "it's been an option for a long time.",
      'it will outlive us all.',
    ]),
    container: cycle([
      'an unlabeled container. do not thaw. do not ask.',
      "the tape says '?'. that's the whole label.",
      'you asked. we said not to ask.',
    ]),
    popsicle: () => {
      popsicleTugs++;
      popsicle.classList.remove('tug');
      void popsicle.offsetWidth;
      popsicle.classList.add('tug');
      if (popsicleTugs === 1) return "a popsicle, frozen to the shelf. it's part of the shelf now.";
      if (popsicleTugs === 2) return "you pulled. it didn't come off. the shelf won.";
      return pick(["it's structural at this point.", 'the shelf and the popsicle are one.', 'leave it. it has a home.']);
    },
    icebag: cycle([
      "a bag of ice. it's one giant cube now.",
      "it thawed once and refroze. we don't talk about that week.",
      'you would need a hammer. there is no hammer.',
    ]),
    cake: cycle([
      'a birthday cake from a party nobody remembers.',
      "it says 'happy birth'. the rest fell off.",
      "one slice is missing. nobody admits to it.",
    ]),
    bulb: cycle([
      'a caged light bulb. the cage protects the bulb. from what, nobody says.',
      "it flickers when you're not looking.",
      "it's the warmest thing in here. it is barely warm.",
    ]),
    fan: cycle([
      'the evaporator fan. it blows cold air at the cold air.',
      "it's the only thing in here working hard.",
      "it has icicles now. it's making its own weather.",
    ]),
    thermo: () => {
      const t = Math.round(temp);
      if (t > -10) return `${t}°f. it went up. somebody left the door open.`;
      if (t === -10) return "-10°f. that's where it was when you came in.";
      return pick([
        `${t}°f. it was -10 when you came in.`,
        `${t}°f. the needle only goes one way.`,
        `${t}°f. it's not broken. it's just honest.`,
      ]);
    },
    log: cycle([
      'the temperature log. -10, -10, -10, -9, -10. riveting.',
      'somebody checks it every four hours. somebody is not here.',
      "you could add an entry. you don't have a pen.",
    ]),
    door: cycle([
      "a very heavy door. the handle is on the other side.",
      "there's a knob on this side. it's red. that's the one.",
      "you knocked. nobody's out there. it's a freezer.",
    ]),
    sign: cycle([
      "walk-in freezer. keep door closed. it's closed. you're welcome.",
      'the sign is for the people outside. you are not outside.',
    ]),
    sticky: cycle([
      'the red knob works. we checked. signed, mgmt.',
      "mgmt did not say how they checked. they're not here either.",
    ]),
    strips: () => {
      stripEls.forEach((s, i) => {
        s.style.setProperty('--sw', ((i % 2 ? -1 : 1) * (2 + Math.random() * 3)).toFixed(1) + 'deg');
        s.classList.add('push');
        clearTimeout(s._t);
        s._t = setTimeout(() => s.classList.remove('push'), 220 + i * 40);
      });
      return pick([
        'plastic strip curtains. they keep the cold in. they are not keeping you in.',
        "they flap. that's all they do. they're good at it.",
      ]);
    },
  };
  stage.addEventListener('click', e => {
    const el = e.target.closest('[data-obj]');
    if (!el || !OBJ[el.dataset.obj]) return;
    say(OBJ[el.dataset.obj]());
  });

  // ---------- the longer you stay ----------
  const MILESTONES = [
    [22, "it's getting colder. that's the idea."],
    [55, 'your breath is visible. it always was. now you notice.'],
    [110, "the frost is coming in from the edges. it does that."],
    [180, "you've been in here three minutes. the peas have been in here four years."],
    [300, "you're basically a frozen good now. nobody is going to label you."],
  ];
  let milestone = 0;

  // ---------- go ----------
  let last = performance.now();
  let coldTick = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (!document.hidden) {
      inside += dt;
      coldSeconds += dt;
      c = clamp(coldSeconds / FULL_COLD, 0, 1);
      growFrost(dt);

      coldTick += dt;
      if (coldTick > 1) {
        coldTick = 0;
        applyCold();
      }

      temp += (targetTemp(now) - temp) * Math.min(1, dt * 0.8);
      needleAngle += (angleFor(temp) - needleAngle) * Math.min(1, dt * 3);
      needle.setAttribute('transform', `rotate(${needleAngle.toFixed(2)} 40 70)`);

      if (milestone < MILESTONES.length && inside > MILESTONES[milestone][0]) {
        if (now - lastSay > 8000) {
          say(MILESTONES[milestone][1]);
          milestone++;
        }
      }
    }
    requestAnimationFrame(frame);
  }

  applyCold();
  say("a walk-in freezer. the light is on. it's always on in here.");
  // the door closes behind you. they do that
  setTimeout(() => closeDoor('the door closed. they do that.'), reduceMotion ? 600 : 1400);
  requestAnimationFrame(frame);
})();
</script>
<script src="../assets/rooms.js"></script>
<script src="../assets/away.js"></script>
</body>
