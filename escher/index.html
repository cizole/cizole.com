<style>
  :root {
    --paper: #efe7d6;
    --ink: #1c1914;
    --ink-soft: rgba(28, 25, 20, 0.6);
  }
  html, body { overflow: hidden; background: var(--paper); }
  body {
    color: var(--ink);
    background: radial-gradient(ellipse at 50% 40%, #f3ecdc, #e6dcc7 80%);
  }

  /* the room is a square print hung on the page. the whole print can be turned. */
  #print {
    position: fixed;
    --u: 6px;
    width: 600px;
    height: 600px;
    left: 0;
    top: 0;
    transform-origin: 50% 50%;
    outline: 1px solid rgba(28, 25, 20, 0.28);
    outline-offset: 7px;
    box-shadow: 0 14px 40px rgba(60, 40, 10, 0.22);
    overflow: hidden;
  }
  #wall, #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #wall { z-index: 0; }
  #stage { z-index: 1; touch-action: none; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  .vignette {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    box-shadow: inset 0 0 calc(var(--u) * 16) rgba(90, 64, 30, 0.28);
  }

  /* doors and windows that picked a different floor. click one and it gets its way. */
  .prop {
    position: absolute;
    z-index: 3;
    padding: 0;
    border: 0;
    background: none;
    color: var(--ink);
    cursor: pointer;
  }
  .prop svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .prop:focus-visible { outline: 2px dashed var(--ink); outline-offset: 4px; }
  .prop.grav:hover svg { filter: drop-shadow(0 0 3px rgba(28, 25, 20, 0.35)); }
  .ceiling-door { top: 0; left: calc(50% - var(--u) * 4); width: calc(var(--u) * 8); height: calc(var(--u) * 14); transform: rotate(180deg); }
  .wall-door { left: calc(var(--u) * 3); top: calc(50% - var(--u) * 7); width: calc(var(--u) * 8); height: calc(var(--u) * 14); transform: rotate(90deg); }
  .side-window { right: calc(var(--u) * 1); top: calc(24% - var(--u) * 6); width: calc(var(--u) * 10); height: calc(var(--u) * 12); transform: rotate(-90deg); }
  .floor-lamp { right: calc(var(--u) * 17); bottom: 0; width: calc(var(--u) * 6); height: calc(var(--u) * 15); transform: rotate(180deg); }
  .exit-door { left: 0; top: 0; width: calc(var(--u) * 5.5); height: calc(var(--u) * 10.5); }
  .wall-walker { right: calc(var(--u) * 1.5); top: 0; width: calc(var(--u) * 4); height: calc(var(--u) * 7); will-change: transform; }
  .wall-walker .leg { transform-origin: 20px 44px; animation: stride 0.9s ease-in-out infinite alternate; }
  .wall-walker .leg.b { animation-delay: -0.45s; }
  @keyframes stride {
    from { transform: rotate(-22deg); }
    to { transform: rotate(22deg); }
  }

  /* things that stay put while the room turns */
  .counter {
    position: fixed;
    top: 14px;
    right: 16px;
    z-index: 4;
    padding: 5px 9px;
    background: rgba(239, 231, 214, 0.9);
    font-size: 13px;
    line-height: 1.55;
    text-align: right;
  }
  .counter b { font-weight: 700; }
  .counter .hint, .counter .small { color: var(--ink-soft); }
  .counter .small { font-size: 12px; }
  .counter button {
    margin-top: 2px;
    padding: 1px 6px;
    border: 1px solid var(--ink-soft);
    border-radius: 3px;
    background: none;
    color: var(--ink-soft);
    font: 12px var(--font);
    cursor: pointer;
  }
  .counter button.on { color: var(--ink); border-color: var(--ink); }
  .climb {
    position: fixed;
    right: 16px;
    bottom: 64px;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .climb button {
    width: 46px;
    height: 46px;
    border: 2px solid var(--ink);
    border-radius: 50%;
    background: rgba(239, 231, 214, 0.92);
    color: var(--ink);
    font: 700 18px var(--font);
    cursor: pointer;
    touch-action: none;
    user-select: none;
  }
  .climb button:active { background: var(--ink); color: var(--paper); }
  .caption {
    position: fixed;
    left: 50%;
    bottom: 16px;
    z-index: 4;
    max-width: min(640px, 92vw);
    padding: 6px 12px;
    border-radius: 4px;
    background: rgba(239, 231, 214, 0.92);
    font-size: 14px;
    line-height: 1.45;
    text-align: center;
    transform: translateX(-50%);
    transition: opacity 0.18s;
  }
  .caption.fade { opacity: 0; }

  @media (max-width: 640px) {
    .counter { font-size: 12px; }
    .caption { max-width: calc(100vw - 88px); left: 12px; transform: none; text-align: left; }
  }
  @media (prefers-reduced-motion: reduce) {
    .wall-walker .leg { animation-duration: 2s; }
  }
</style>

<div class="counter" aria-live="off">

  by you: <b id="mine">0</b> <span class="small">(lifetime <b id="lifetime">0</b>)</span><br>

<script type="module">
import * as THREE from 'three';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

const $ = s => document.querySelector(s);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer: coarse)').matches;
const INK = '#1c1914';
const PAPER = '#efe7d6';
const TAU = Math.PI * 2;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (err) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (err) { /* storage off */ } },
};

// ---------- captions ----------
const captionEl = $('#caption');
let captionTimer = 0;
let lastSay = performance.now();
function say(text) {
  lastSay = performance.now();
  clearTimeout(captionTimer);
  captionEl.classList.add('fade');
  captionTimer = setTimeout(() => {
    captionEl.textContent = text;
    captionEl.classList.remove('fade');
  }, 180);
}
const cyclers = {};
function cycle(key, lines) {
  const i = cyclers[key] ?? 0;
  cyclers[key] = i + 1;
  return lines[i % lines.length];
}

// ---------- the counters ----------
const floorsEl = $('#floors');
const mineEl = $('#mine');
const lifetimeEl = $('#lifetime');
let floors = parseInt(store.get('cizole.escher.floors'), 10);
if (!Number.isFinite(floors) || floors < 412) floors = 412;
let lifetime = parseInt(store.get('cizole.escher.laps'), 10);
if (!Number.isFinite(lifetime) || lifetime < 0) lifetime = 0;
let mine = 0;
function renderCounters() {
  floorsEl.textContent = floors.toLocaleString('en-US');
  mineEl.textContent = String(mine);
  lifetimeEl.textContent = lifetime.toLocaleString('en-US');
}
renderCounters();
if (coarse) $('#hint').textContent = 'buttons to climb · drag to look';

// =====================================================================
// the print: a square on the page that holds the whole room. gravity is
// whichever way the print is turned. everything outside it (the counter,
// the caption, the exit to the lobby) stays put. it has seen this before.
// =====================================================================
const print = $('#print');
let S = 600;      // the print's side, in css px
let PX = 0, PY = 0; // where it sits on the page
let roll = 0;     // how far the print is turned, radians, clockwise
let rollAnim = null; // { from, to, start, dur }
const ROLL_T = reduceMotion ? 0 : 1.2;

function layoutPrint() {
  S = Math.max(160, Math.min(innerWidth, innerHeight) - 16);
  PX = Math.round((innerWidth - S) / 2);
  PY = Math.round((innerHeight - S) / 2);
  print.style.left = PX + 'px';
  print.style.top = PY + 'px';
  print.style.width = S + 'px';
  print.style.height = S + 'px';
  print.style.setProperty('--u', (S / 100).toFixed(3) + 'px');
}
function applyRoll() {
  print.style.transform = `rotate(${roll.toFixed(4)}rad)`;
}
// page coords -> print coords (as if the print weren't turned)
function toLocal(x, y) {
  const cx = PX + S / 2, cy = PY + S / 2;
  const dx = x - cx, dy = y - cy;
  const c = Math.cos(roll), s = Math.sin(roll);
  return { x: S / 2 + dx * c + dy * s, y: S / 2 - dx * s + dy * c };
}
function localDelta(dx, dy) {
  const c = Math.cos(roll), s = Math.sin(roll);
  return { x: dx * c + dy * s, y: -dx * s + dy * c };
}

// the pointer, in print coords, shared by the wall's eyes
const pointer = { x: 300, y: 300 };
addEventListener('pointermove', e => {
  const p = toLocal(e.clientX, e.clientY);
  pointer.x = p.x;
  pointer.y = p.y;
});

// =====================================================================
// the wall: an original tessellation that slowly turns into eyes.
// every edge is one shared curve, so neighbouring tiles always fit.
// =====================================================================
const wall = $('#wall');
const wctx = wall.getContext('2d');
let G = 80;
let paper = null;

function sizeWall() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  wall.width = Math.round(S * dpr);
  wall.height = Math.round(S * dpr);
  wctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  G = clamp(S / 8, 52, 96);
  // paper, drawn once per size: base color, specks, a few fibers
  paper = document.createElement('canvas');
  paper.width = wall.width;
  paper.height = wall.height;
  const p = paper.getContext('2d');
  p.setTransform(dpr, 0, 0, dpr, 0, 0);
  p.fillStyle = PAPER;
  p.fillRect(0, 0, S, S);
  for (let i = 0; i < (S * S) / 500; i++) {
    p.fillStyle = `rgba(90, 70, 40, ${(0.03 + Math.random() * 0.07).toFixed(3)})`;
    p.fillRect(Math.random() * S, Math.random() * S, 1, 1);
  }
  p.strokeStyle = 'rgba(120, 96, 60, 0.07)';
  p.lineWidth = 1;
  for (let i = 0; i < 60; i++) {
    const x = Math.random() * S, y = Math.random() * S;
    p.beginPath();
    p.moveTo(x, y);
    p.quadraticCurveTo(x + (Math.random() - 0.5) * 30, y + (Math.random() - 0.5) * 30, x + (Math.random() - 0.5) * 50, y + (Math.random() - 0.5) * 50);
    p.stroke();
  }
}

const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
// edge shapes: zero at both ends, so every tile keeps its corners
const fH = t => 0.2 * Math.sin(TAU * t) + 0.08 * Math.sin(2 * TAU * t);
const fV = t => 0.18 * Math.sin(TAU * t) - 0.09 * Math.sin(3 * TAU * t);
// how far a spot on the wall has morphed, drifting slowly across it
function morph(x, y, t) {
  const phase = (x / S) * TAU * 0.9 + (y / S) * 1.3 - t * 0.00009;
  return smooth(0.15, 0.85, 0.5 + 0.5 * Math.sin(phase));
}
const hash = (i, j) => { const s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return s - Math.floor(s); };
const SEG = 10;

function drawWall(now) {
  if (!paper) return;
  const t = reduceMotion ? 20000 : now;
  wctx.drawImage(paper, 0, 0, S, S);
  wctx.lineWidth = 1;
  wctx.lineJoin = 'round';
  const n = Math.ceil(S / G) + 1;
  for (let j = -1; j < n; j++) {
    for (let i = -1; i < n; i++) {
      const x0 = i * G, y0 = j * G;
      const aT = morph(x0 + G / 2, y0, t);
      const aB = morph(x0 + G / 2, y0 + G, t);
      const aL = morph(x0, y0 + G / 2, t);
      const aR = morph(x0 + G, y0 + G / 2, t);
      wctx.beginPath();
      for (let s = 0; s <= SEG; s++) { const u = s / SEG; wctx.lineTo(x0 + u * G, y0 + aT * G * fH(u)); }
      for (let s = 0; s <= SEG; s++) { const u = s / SEG; wctx.lineTo(x0 + G + aR * G * fV(u), y0 + u * G); }
      for (let s = SEG; s >= 0; s--) { const u = s / SEG; wctx.lineTo(x0 + u * G, y0 + G + aB * G * fH(u)); }
      for (let s = SEG; s >= 0; s--) { const u = s / SEG; wctx.lineTo(x0 + aL * G * fV(u), y0 + u * G); }
      wctx.closePath();
      const dark = ((i + j) & 1) === 1;
      if (dark) {
        wctx.fillStyle = 'rgba(28, 25, 20, 0.085)';
        wctx.fill();
      }
      wctx.strokeStyle = 'rgba(28, 25, 20, 0.2)';
      wctx.stroke();

      // the light tiles that have morphed far enough grow an eye
      if (!dark) {
        const cx = x0 + G / 2, cy = y0 + G / 2;
        const a = morph(cx, cy, t);
        if (a > 0.72) drawEye(cx, cy, G * 0.2, (a - 0.72) / 0.28, now, hash(i, j));
      }
    }
  }
}

function drawEye(cx, cy, r, alpha, now, seed) {
  // blink now and then, each eye on its own schedule
  const cycleT = ((now / 1000) * (0.11 + seed * 0.05) + seed * 7) % 1;
  const open = cycleT < 0.025 ? 0.12 : 1;
  wctx.save();
  wctx.globalAlpha = alpha * 0.85;
  wctx.strokeStyle = INK;
  wctx.lineWidth = 1.4;
  wctx.beginPath();
  wctx.moveTo(cx - r, cy);
  wctx.quadraticCurveTo(cx, cy - r * 0.95 * open, cx + r, cy);
  wctx.quadraticCurveTo(cx, cy + r * 0.95 * open, cx - r, cy);
  wctx.closePath();
  wctx.fillStyle = '#f6f0e2';
  wctx.fill();
  wctx.stroke();
  if (open > 0.5) {
    const dx = pointer.x - cx, dy = pointer.y - cy;
    const d = Math.hypot(dx, dy) || 1;
    const m = Math.min(r * 0.35, d * 0.05);
    wctx.fillStyle = INK;
    wctx.beginPath();
    wctx.arc(cx + (dx / d) * m, cy + (dy / d) * m * 0.6, r * 0.32, 0, TAU);
    wctx.fill();
  }
  wctx.restore();
}

// =====================================================================
// the 3d part: a penrose staircase and an impossible triangle.
// both are real, perfectly ordinary 3d objects that only close up when
// seen exactly along U, the one direction the camera can't see depth in.
// =====================================================================
const U = new THREE.Vector3(1, 2, 1);
const MAGIC_TH = Math.atan2(U.x, U.z);
const MAGIC_PH = Math.asin(U.y / U.length());

// the magic view's screen axes (right, up) and the axis toward the viewer
const BZ = U.clone().normalize();
const BX = new THREE.Vector3(0, 1, 0).cross(BZ).normalize();
const BY = BZ.clone().cross(BX);
const WORLD_UP = new THREE.Vector3(0, 1, 0);

// staircase: 6 steps +x, 6 steps +z, 3 steps -x, 3 steps -z. each step rises
// RISE, so the loop ends exactly 3 * U away from where it began. seen along U,
// the end lands right on top of the start, one step higher than the last one.
const SIDES = [[1, 0, 6], [0, 1, 6], [-1, 0, 3], [0, -1, 3]];
const N = SIDES.reduce((n, s) => n + s[2], 0);
const D = 3;
const RISE = (U.y * D) / N;
const THICK = 1.5;
const tops = [new THREE.Vector3(0, 0, 0)];
for (const [dx, dz, n] of SIDES) {
  for (let k = 0; k < n; k++) {
    const p = tops[tops.length - 1].clone();
    p.x += dx;
    p.z += dz;
    p.y += RISE;
    tops.push(p);
  }
}
// tops[N] is a phantom: where step 0 would be if the stairs kept going. it
// sits exactly D * U from tops[0], so on screen they're the same step.

// the step that looks lowest from the magic angle (the exit door goes there)
let lowest = 0, highest = 0;
for (let i = 1; i < N; i++) {
  if (tops[i].dot(BY) < tops[lowest].dot(BY)) lowest = i;
  if (tops[i].dot(BY) > tops[highest].dot(BY)) highest = i;
}

// triangle: legs of L along x, 2L along y, L along z. the gap is L * U.
const TRI_L = 2.3;
const TRI_W = 0.55;

let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas: $('#stage'), antialias: true, alpha: true });
  renderer.setClearColor(0x000000, 0);
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
} catch (err) {
  renderer = null;
}

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 1000);
const target = new THREE.Vector3();
let viewScale = 0.02;

// ink: flat paper where the light hits, hatching where it doesn't, drawn in
// screen space like an engraving
const inkMat = new THREE.ShaderMaterial({
  uniforms: {
    uPaper: { value: new THREE.Color(PAPER) },
    uInk: { value: new THREE.Color(INK) },
    uLight: { value: new THREE.Vector3(0.25, 1, 0.6).normalize() },
    uPx: { value: 1 },
  },
  vertexShader: `
    varying vec3 vN;
    void main() {
      vN = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 uPaper;
    uniform vec3 uInk;
    uniform vec3 uLight;
    uniform float uPx;
    varying vec3 vN;
    float hatch(vec2 p, float ang, float spacing) {
      float v = (p.x * cos(ang) + p.y * sin(ang)) / spacing;
      float d = abs(fract(v) - 0.5);
      return smoothstep(0.33, 0.43, d);
    }
    void main() {
      float lum = dot(normalize(vN), uLight);
      vec2 p = gl_FragCoord.xy / uPx;
      float ink = 0.0;
      if (lum < 0.7) ink = max(ink, hatch(p, 0.785, 6.0));
      if (lum < 0.3) ink = max(ink, hatch(p, -0.785, 6.0));
      if (lum < -0.2) ink = max(ink, hatch(p, 0.0, 4.0));
      gl_FragColor = vec4(mix(uPaper, uInk, ink * 0.8), 1.0);
      #include <colorspace_fragment>
    }
  `,
  polygonOffset: true,
  polygonOffsetFactor: 1,
  polygonOffsetUnits: 1,
});
const lineMat = new LineMaterial({ color: new THREE.Color(INK), linewidth: 1.7 });
const figureMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(INK) });
const paperMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(PAPER) });

// boxes: { w, h, d, x, y, z } in world units (center + size)
function addBoxes(parent, boxes, kind) {
  const edges = [];
  for (const b of boxes) {
    const geo = new THREE.BoxGeometry(b.w, b.h, b.d);
    const mesh = new THREE.Mesh(geo, inkMat);
    mesh.position.set(b.x, b.y, b.z);
    mesh.userData.kind = kind;
    parent.add(mesh);
    const eg = new THREE.EdgesGeometry(geo);
    const arr = eg.attributes.position.array;
    for (let i = 0; i < arr.length; i += 3) edges.push(arr[i] + b.x, arr[i + 1] + b.y, arr[i + 2] + b.z);
    eg.dispose();
  }
  const lg = new LineSegmentsGeometry();
  lg.setPositions(edges);
  parent.add(new LineSegments2(lg, lineMat));
}

const stairs = new THREE.Group();
addBoxes(stairs, tops.slice(0, N).map(p => ({ w: 1, h: THICK, d: 1, x: p.x, y: p.y - THICK / 2, z: p.z })), 'step');
scene.add(stairs);

const tri = new THREE.Group();
{
  const L = TRI_L, W = TRI_W, h = W / 2;
  addBoxes(tri, [
    { w: L + W, h: W, d: W, x: L / 2, y: 0, z: 0 },                 // along +x, corners included
    { w: W, h: 2 * L, d: W, x: L, y: L + h, z: 0 },                 // up +y from the x corner
    { w: W, h: W, d: L, x: L, y: 2 * L, z: L / 2 + h },             // out along +z, ending "on" the start
  ], 'triangle');
}
scene.add(tri);

// ---------- the figures ----------
// gravity, for a figure, is whichever way the print is turned. this is the
// world direction that shows up as "up" on the page once the print is rolled.
const vup = new THREE.Vector3();
function figureUp(r, out) {
  return out.copy(WORLD_UP).applyAxisAngle(BZ, r);
}
function makeFigure(you) {
  const g = new THREE.Group();
  const kind = you ? 'you' : 'figure';
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.085, 0.26, 4, 10), figureMat);
  body.position.y = 0.23;
  const pack = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.16, 0.08), figureMat);
  pack.position.set(0, 0.28, -0.1);
  body.userData.kind = kind;
  pack.userData.kind = kind;
  g.add(body, pack);
  let head;
  if (you) {
    // the site's mark for a head: a "c" with a dot in it, always facing you
    head = new THREE.Group();
    const cGeo = new THREE.TorusGeometry(0.1, 0.032, 8, 24, Math.PI * 1.5);
    cGeo.rotateZ(Math.PI / 4); // the opening faces right, like the favicon
    const c = new THREE.Mesh(cGeo, figureMat);
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.036, 10, 8), figureMat);
    dot.position.x = 0.012;
    const disc = new THREE.Mesh(new THREE.CircleGeometry(0.135, 20), paperMat);
    disc.position.z = -0.02;
    for (const m of [c, dot, disc]) m.userData.kind = kind;
    head.add(disc, c, dot);
  } else {
    head = new THREE.Mesh(new THREE.SphereGeometry(0.095, 12, 10), figureMat);
    head.userData.kind = kind;
  }
  head.position.y = 0.47;
  g.add(head);
  g.userData.kind = kind;
  scene.add(g);
  return { mesh: g, body, head, you };
}

const STEP_TIME = reduceMotion ? 1.9 : 0.95;      // the others' pace
const HOP_T = reduceMotion ? 0.5 : 0.28;          // your hop
const FOLLOW_STEP = 0.5;
const walkers = [0, 6.3, 12.6].map(k => ({ ...makeFigure(false), k, prevK: k, tumble: null }));
const you = { ...makeFigure(true), k: 3, hop: null, sitting: false, tumble: null, steps: 0 };
let following = false;

const fpos = new THREE.Vector3();
const qUp = new THREE.Quaternion();
const qYaw = new THREE.Quaternion();
const qSpin = new THREE.Quaternion();
const qHead = new THREE.Quaternion();
const mHead = new THREE.Matrix4();
const hx = new THREE.Vector3(), hy = new THREE.Vector3();
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

function placeFigure(f, now) {
  // mid-hop past either end, k is briefly outside [0, N); the stairs don't mind
  const kk = ((f.k % N) + N) % N;
  const i = Math.floor(kk);
  const t = kk - i;
  const a = tops[i], b = tops[i + 1];
  figureUp(roll, vup);
  fpos.lerpVectors(a, b, t);
  fpos.addScaledVector(vup, Math.sin(Math.PI * t) * 0.16);
  let spin = 0;
  if (f.tumble) {
    const u = clamp((now - f.tumble.start) / f.tumble.dur, 0, 1);
    fpos.addScaledVector(vup, Math.sin(Math.PI * u) * f.tumble.height);
    spin = f.tumble.spin * easeInOut(u);
    if (u >= 1) f.tumble = null;
  }
  f.mesh.position.copy(fpos);
  qUp.setFromUnitVectors(WORLD_UP, vup);
  qYaw.setFromAxisAngle(WORLD_UP, Math.atan2(b.x - a.x, b.z - a.z));
  f.mesh.quaternion.copy(qUp).multiply(qYaw);
  if (spin) {
    qSpin.setFromAxisAngle(BZ, spin);
    f.mesh.quaternion.premultiply(qSpin);
  }
  if (f.sitting) {
    f.body.scale.set(1.15, 0.62, 1.15);
    f.head.position.y = 0.36;
  } else {
    f.body.scale.set(1, 1, 1);
    f.head.position.y = 0.47;
  }
  if (f.you) {
    // the "c" stays upright and faces the viewer whatever the body is doing
    hy.copy(vup).addScaledVector(BZ, -vup.dot(BZ)).normalize();
    hx.crossVectors(hy, BZ);
    mHead.makeBasis(hx, hy, BZ);
    qHead.setFromRotationMatrix(mHead);
    f.head.quaternion.copy(f.mesh.quaternion).invert().multiply(qHead);
  }
}

// ---------- layout: fit everything, as seen from the magic angle ----------
const tmp = new THREE.Vector3();
function boxCorners(obj, out) {
  obj.updateMatrixWorld(true);
  obj.traverse(o => {
    if (!o.isMesh || o.isLineSegments2 || o.userData.kind === 'figure' || o.userData.kind === 'you') return;
    o.geometry.computeBoundingBox();
    const bb = o.geometry.boundingBox;
    for (let c = 0; c < 8; c++) {
      tmp.set(c & 1 ? bb.max.x : bb.min.x, c & 2 ? bb.max.y : bb.min.y, c & 4 ? bb.max.z : bb.min.z).applyMatrix4(o.matrixWorld);
      out.push(tmp.clone());
    }
  });
  return out;
}
function extent(points) {
  const e = { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity, cz: 0 };
  for (const p of points) {
    const x = p.dot(BX), y = p.dot(BY);
    e.minX = Math.min(e.minX, x); e.maxX = Math.max(e.maxX, x);
    e.minY = Math.min(e.minY, y); e.maxY = Math.max(e.maxY, y);
    e.cz += p.dot(BZ) / points.length;
  }
  return e;
}

function placeTriangle(beside) {
  tri.position.set(0, 0, 0);
  const s = extent(boxCorners(stairs, []));
  const t = extent(boxCorners(tri, []));
  const tw = t.maxX - t.minX, th = t.maxY - t.minY;
  let x, y;
  if (beside) {
    x = s.maxX + 1.6 + tw / 2;
    y = s.maxY - th / 2 - 0.4;
  } else {
    x = (s.minX + s.maxX) / 2;
    y = s.minY - 1.4 - th / 2;
  }
  // move it so its projected center lands on (x, y), at the stairs' depth
  const cx = (t.minX + t.maxX) / 2, cy = (t.minY + t.maxY) / 2;
  tri.position.copy(BX).multiplyScalar(x - cx).addScaledVector(BY, y - cy).addScaledVector(BZ, s.cz - t.cz);
}

// room left on each side of the print for the doors, in print px
function margins() {
  const u = S / 100;
  return { l: 16 * u, r: 14 * u, t: 15 * u, b: 17 * u };
}

function measureLayout(beside) {
  placeTriangle(beside);
  const pts = boxCorners(stairs, []);
  boxCorners(tri, pts);
  // headroom for the figures on the highest steps
  for (const p of tops) pts.push(p.clone().add(new THREE.Vector3(0, 0.7, 0)));
  const e = extent(pts);
  const m = margins();
  const aw = Math.max(60, S - m.l - m.r);
  const ah = Math.max(60, S - m.t - m.b);
  const vs = Math.max((e.maxX - e.minX) / aw, (e.maxY - e.minY) / ah);
  const dxp = (m.l + aw / 2) - S / 2;
  const dyp = S / 2 - (m.t + ah / 2);
  return {
    beside, vs,
    tx: (e.minX + e.maxX) / 2 - dxp * vs,
    ty: (e.minY + e.maxY) / 2 - dyp * vs,
    cz: e.cz,
  };
}

const exitDoor = $('.exit-door');
function placeExit() {
  // just left of the lowest-looking step, feet on its baseline
  camera.updateMatrixWorld(true);
  const u = S / 100;
  const p = tops[lowest].clone().project(camera);
  const x = (p.x + 1) / 2 * S;
  const y = (1 - p.y) / 2 * S;
  const w = 5.5 * u, h = 10.5 * u;
  exitDoor.style.left = clamp(x - 9 * u - w / 2, u, S - w - u).toFixed(1) + 'px';
  exitDoor.style.top = clamp(y + 0.6 * u - h, u, S - h - u).toFixed(1) + 'px';
}

function fit() {
  layoutPrint();
  applyRoll();
  sizeWall();
  if (renderer) {
    renderer.setSize(S, S, false);
    lineMat.resolution.set(S, S);
    inkMat.uniforms.uPx.value = renderer.getPixelRatio();
  }
  // whichever way the triangle fits bigger
  const a = measureLayout(true);
  const b = measureLayout(false);
  const L = a.vs <= b.vs ? a : b;
  placeTriangle(L.beside);
  viewScale = L.vs;
  // rotate around a point at the scene's depth, so dragging orbits nicely
  target.copy(BX).multiplyScalar(L.tx).addScaledVector(BY, L.ty).addScaledVector(BZ, L.cz);
  camera.left = -S / 2 * viewScale;
  camera.right = S / 2 * viewScale;
  camera.top = S / 2 * viewScale;
  camera.bottom = -S / 2 * viewScale;
  camera.updateProjectionMatrix();
  applyCamera();
  placeExit();
}

// ---------- the camera, and how badly it's being looked at ----------
const off = { th: 0, ph: 0 };
const vel = { th: 0, ph: 0 };
const dir = new THREE.Vector3();
let dragging = false;
let broken = false;
let drift = null;
let lastInteract = performance.now();
let nextDrift = performance.now() + 50000 + Math.random() * 20000;

const BREAK_LINES = [
  'it only works from here.',
  "don't look at it like that. it's shy.",
  "from over there it's just a pile of stairs.",
  "you've seen how it's done now. please forget.",
];
const FIXED_LINES = ['there. fixed.', 'back to normal. normal-ish.', 'there. all the way around again.'];

function applyCamera() {
  const th = MAGIC_TH + off.th;
  const ph = clamp(MAGIC_PH + off.ph, 0.08, 1.52);
  dir.set(Math.cos(ph) * Math.sin(th), Math.sin(ph), Math.cos(ph) * Math.cos(th));
  camera.position.copy(target).addScaledVector(dir, 200);
  camera.up.set(0, 1, 0);
  camera.lookAt(target);
}

function updateCamera(dt, now) {
  if (!dragging) {
    let goalTh = 0, goalPh = 0;
    if (drift) {
      if (now < drift.until) { goalTh = drift.th; goalPh = drift.ph; } else drift.released = true;
    }
    const k = drift && !drift.released ? 5 : 36;
    const c = 2 * Math.sqrt(k);
    vel.th += (-(off.th - goalTh) * k - vel.th * c) * dt;
    vel.ph += (-(off.ph - goalPh) * k - vel.ph * c) * dt;
    off.th += vel.th * dt;
    off.ph += vel.ph * dt;
  }
  const mag = Math.abs(off.th) + Math.abs(off.ph);
  if (!broken && mag > 0.03) {
    broken = true;
    if (dragging) say(cycle('break', BREAK_LINES));
    else if (drift) say('the room shifted a little. sorry.');
  }
  if (broken && !dragging && mag < 0.002 && Math.abs(vel.th) + Math.abs(vel.ph) < 0.01) {
    broken = false;
    off.th = off.ph = vel.th = vel.ph = 0;
    say(drift ? "fine now. it's fine." : cycle('fixed', FIXED_LINES));
    drift = null;
  }
  // now and then the room slips on its own, then catches itself
  if (!reduceMotion && !drift && !dragging && !broken && !rollAnim && now > nextDrift && now - lastInteract > 15000) {
    drift = { th: (Math.random() < 0.5 ? -1 : 1) * 0.09, ph: -0.04, until: now + 2200, released: false };
    nextDrift = now + 55000 + Math.random() * 25000;
  }
  applyCamera();
}

// ---------- your hands: dragging the view ----------
const stage = $('#stage');
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let down = null;

stage.addEventListener('pointerdown', e => {
  down = { x: e.clientX, y: e.clientY, th: off.th, ph: off.ph, id: e.pointerId, moved: false };
  try { stage.setPointerCapture(e.pointerId); } catch (err) { /* synthetic pointer */ }
  lastInteract = performance.now();
});
stage.addEventListener('pointermove', e => {
  if (!down || e.pointerId !== down.id) return;
  const d = localDelta(e.clientX - down.x, e.clientY - down.y);
  if (!down.moved && Math.hypot(d.x, d.y) < 5) return;
  down.moved = true;
  dragging = true;
  drift = null;
  stage.classList.add('dragging');
  off.th = clamp(down.th - d.x * 0.006, -1.4, 1.4);
  off.ph = clamp(down.ph + d.y * 0.005, -1.2, 0.8);
  vel.th = vel.ph = 0;
  lastInteract = performance.now();
});
function release(e) {
  if (!down || e.pointerId !== down.id) return;
  if (!down.moved) clickAt(e.clientX, e.clientY);
  down = null;
  dragging = false;
  stage.classList.remove('dragging');
}
stage.addEventListener('pointerup', release);
stage.addEventListener('pointercancel', release);

const CLICK_LINES = {
  step: [
    "a step. it's the first step. it's also the last step.",
    'every step here is up. check if you want.',
    "the architect was asked to add an elevator. this was the elevator.",
  ],
  figure: [
    "they're almost at the top. they've been almost at the top for a while.",
    "don't tell them.",
    "that one counts every step. it's on step one.",
    "they don't stop to rest. resting would mean admitting something.",
  ],
  you: [
    "that's you. floor 1. it suits you.",
    "you can't click yourself up the stairs. arrows.",
    'the mark on your head is the site. you are the site now. keep climbing.',
  ],
  triangle: [
    'a triangle. three corners. all of them right angles. that is more than a triangle is allowed.',
    "it's solid. it's also not. drag and see.",
    "it's closed. it has never been closed.",
  ],
};
function clickAt(x, y) {
  if (!renderer) return;
  const p = toLocal(x, y);
  ndc.set((p.x / S) * 2 - 1, -(p.y / S) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const targets = [];
  scene.traverse(o => { if (o.isMesh && !o.isLineSegments2) targets.push(o); });
  const hit = raycaster.intersectObjects(targets, false)[0];
  if (!hit) return;
  const kind = hit.object.userData.kind;
  if (CLICK_LINES[kind]) say(cycle(kind, CLICK_LINES[kind]));
}

// ---------- climbing ----------
const LAP_LINES = {
  1: "one floor. you're on floor 1. you were on floor 1.",
  3: "you've been going up for a while. ground floor.",
  5: 'the stairs are impressed. you are still on floor 1.',
  10: "at this point it's a lifestyle.",
  25: 'twenty-five. the others have started a club. the meetings are on floor 1.',
  50: 'fifty floors. same floor. the counter has stopped meaning anything. it keeps counting.',
};
const DOWN_LINES = [
  "you went down. you arrived at the top. don't think about it.",
  'down again. up again. same again.',
  "going down is going up here. the stairs don't take sides.",
];
const held = new Set();
let lastStepAt = performance.now();
let sound = null;

function lap(byYou, wentDown) {
  floors++;
  store.set('cizole.escher.floors', String(floors));
  if (byYou) {
    mine++;
    lifetime++;
    store.set('cizole.escher.laps', String(lifetime));
    if (wentDown) say(cycle('down', DOWN_LINES));
    else if (LAP_LINES[mine]) say(LAP_LINES[mine]);
    if (mine === 3 && !following) {
      following = true;
      setTimeout(() => say("the others have decided you know the way. you don't. they're behind you now."), 3200);
    }
  }
  renderCounters();
}

function step(dirn) {
  if (you.hop || rollAnim) return;
  const now = performance.now();
  lastStepAt = now;
  lastInteract = now;
  you.steps++;
  if (you.sitting) {
    you.sitting = false;
    say('up you get.');
  }
  you.hop = { from: you.k, to: you.k + dirn, start: now };
  scratch();
}

function updateYou(now) {
  if (you.hop) {
    const u = clamp((now - you.hop.start) / (HOP_T * 1000), 0, 1);
    you.k = you.hop.from + (you.hop.to - you.hop.from) * easeInOut(u);
    if (u >= 1) {
      you.k = you.hop.to;
      you.hop = null;
      if (you.k >= N) { you.k -= N; lap(true, false); }
      if (you.k < 0) { you.k += N; lap(true, true); }
    }
  } else if (!rollAnim) {
    if (held.has('up') && !held.has('down')) step(1);
    else if (held.has('down') && !held.has('up')) step(-1);
  }
  if (!you.sitting && you.steps > 0 && now - lastStepAt > 20000 && !rollAnim) {
    you.sitting = true;
    say("you sat down. on the stairs. the stairs don't mind. they're still going up.");
  }
}

const wrapDelta = d => ((d + N / 2) % N + N) % N - N / 2;
function updateWalkers(dt) {
  walkers.forEach((f, i) => {
    f.prevK = f.k;
    if (following) {
      const want = ((you.k - 1.5 * (i + 1)) % N + N) % N;
      const d = wrapDelta(want - f.k);
      const maxStep = dt / FOLLOW_STEP;
      f.k += clamp(d, -maxStep, maxStep);
    } else {
      f.k += dt / STEP_TIME;
    }
    if (f.k >= N) { f.k -= N; lap(false, false); }
    if (f.k < 0) { f.k += N; }
  });
}

// keys: arrows or wasd. up, right, w, d climb. down, left, s, a descend.
const KEY_UP = ['ArrowUp', 'ArrowRight', 'w', 'W', 'd', 'D'];
const KEY_DOWN = ['ArrowDown', 'ArrowLeft', 's', 'S', 'a', 'A'];
const typing = el => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);
addEventListener('keydown', e => {
  if (typing(e.target) || e.ctrlKey || e.metaKey || e.altKey) return;
  const up = KEY_UP.includes(e.key), dn = KEY_DOWN.includes(e.key);
  if (!up && !dn) return;
  e.preventDefault();
  if (e.repeat) return;
  held.add(up ? 'up' : 'down');
  drift = null;
});
addEventListener('keyup', e => {
  if (KEY_UP.includes(e.key)) held.delete('up');
  if (KEY_DOWN.includes(e.key)) held.delete('down');
});
addEventListener('blur', () => held.clear());
for (const [id, key] of [['#up', 'up'], ['#down', 'down']]) {
  const b = $(id);
  b.addEventListener('pointerdown', e => { e.preventDefault(); held.add(key); try { b.setPointerCapture(e.pointerId); } catch (err) { /* synthetic */ } });
  const letGo = () => held.delete(key);
  b.addEventListener('pointerup', letGo);
  b.addEventListener('pointercancel', letGo);
  b.addEventListener('lostpointercapture', letGo);
  b.addEventListener('click', e => { if (e.detail === 0) step(key === 'up' ? 1 : -1); }); // keyboard-activated
}

// ---------- sound: a pen scratch per step, if you ask for it ----------
const soundBtn = $('#sound');
function scratch() {
  if (!sound || !sound.on) return;
  const ctx = sound.ctx;
  const t = ctx.currentTime;
  const src = ctx.createBufferSource();
  src.buffer = sound.noise;
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 1800 + Math.random() * 1400;
  bp.Q.value = 1.2;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.16, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
  src.connect(bp).connect(g).connect(ctx.destination);
  src.start(t, Math.random() * 0.4);
  src.stop(t + 0.09);
}
soundBtn.addEventListener('click', () => {
  if (!sound) {
    const ctx = new AudioContext();
    const noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    sound = { ctx, noise, on: false };
  }
  sound.on = !sound.on;
  if (sound.on) sound.ctx.resume();
  soundBtn.textContent = sound.on ? 'sound: on' : 'sound: off';
  soundBtn.classList.toggle('on', sound.on);
  if (sound.on) scratch();
});

// ---------- doors on the wrong walls: click one and it becomes the floor ----------
const GRAV_LINES = [
  "that's the floor now. it was always the floor, for someone.",
  'the exit does not rotate. it has seen this before.',
  'everyone fell over. everyone got up. everyone is on floor 1.',
  'the lamp is fine. the lamp is always fine.',
  'the stairs still go up. up moved.',
];
const PROP_LINES = {
  ceiling: [
    "that door is on the ceiling. it's a normal door, for someone.",
    'someone knocks from the other side. from above. from below. from over there.',
  ],
  wall: [
    'that door is a floor now. please wipe your feet on it.',
    'it leads to this room. every door here does.',
  ],
  window: [
    'the window faces down. the view is excellent. the view is the floor.',
    "someone is looking in. it's you, from the other wall.",
  ],
  lamp: [
    "the lamp hangs up from the floor. the light doesn't mind.",
    'it lights the ceiling from below. from above. it lights the ceiling.',
  ],
  walker: [
    "it's fine. that's its floor.",
    "it thinks you're the one who's sideways.",
    "it's been walking up this wall all day. it's also still on floor 1.",
  ],
  exit: [
    'this is the exit. it exits to here.',
    "you took the exit. you're at the top now. the top is here.",
    'exit: taken. floor: 1.',
  ],
};
const normAngle = a => Math.atan2(Math.sin(a), Math.cos(a));
const floored = {};

function turnTo(targetRoll, propName) {
  const delta = normAngle(targetRoll - roll);
  if (Math.abs(delta) < 0.01) {
    say(cycle('already', ["it's already the floor. you're standing on it. sort of.", 'that one is the floor. it would like to stay the floor.']));
    return;
  }
  const now = performance.now();
  rollAnim = { from: roll, to: roll + delta, start: now, dur: ROLL_T * 1000 };
  floored[propName] = (floored[propName] || 0) + 1;
  if (!reduceMotion) {
    for (const f of [you, ...walkers]) {
      f.tumble = { start: now, dur: 1200, spin: (Math.random() < 0.5 ? -1 : 1) * TAU * (1 + Math.round(Math.random())), height: 0.35 + Math.random() * 0.3 };
    }
  }
  you.sitting = false;
  lastInteract = now;
  lastStepAt = now; // falling over counts as getting up
  const n = floored[propName];
  if (n >= 3) say(`this door has been the floor ${n} times. it's getting comfortable.`);
  else say(cycle('grav', GRAV_LINES));
}

function updateRoll(now) {
  if (!rollAnim) return;
  const u = rollAnim.dur ? clamp((now - rollAnim.start) / rollAnim.dur, 0, 1) : 1;
  roll = rollAnim.from + (rollAnim.to - rollAnim.from) * easeInOut(u);
  if (u >= 1) {
    roll = normAngle(rollAnim.to);
    rollAnim = null;
  }
  applyRoll();
}

for (const el of document.querySelectorAll('[data-prop]')) {
  el.addEventListener('click', () => {
    lastInteract = performance.now();
    const name = el.dataset.prop;
    if (name === 'exit') {
      if (you.hop || rollAnim) return;
      you.k = highest;
      you.sitting = false;
      lastStepAt = performance.now();
      say(cycle('exit', PROP_LINES.exit));
      return;
    }
    if (el.dataset.grav !== undefined) {
      if (rollAnim) return;
      // upright means the door's own tilt plus the print's turn add up to nothing
      const own = parseFloat(el.dataset.grav) * Math.PI / 180;
      // a second click on the same door, once it's the floor, just talks about it
      if (Math.abs(normAngle(-own - roll)) < 0.01 && Math.random() < 0.6) {
        say(cycle('prop-' + name, PROP_LINES[name]));
        return;
      }
      turnTo(-own, name);
      return;
    }
    say(cycle('prop-' + name, PROP_LINES[name]));
  });
}

// the one walking up the right-hand wall
const wallWalker = $('.wall-walker');
const ww = { y: 0.8, dir: -1 };
function updateWallWalker(dt) {
  const topY = S * 0.44, botY = S * 0.86;
  const speed = (reduceMotion ? 10 : 22) / Math.max(1, botY - topY);
  ww.y += ww.dir * speed * dt;
  if (ww.y < 0) { ww.y = 0; ww.dir = 1; }
  if (ww.y > 1) { ww.y = 1; ww.dir = -1; }
  const y = topY + ww.y * (botY - topY);
  // feet on the wall, facing where it's going
  wallWalker.style.transform = `translateY(${y.toFixed(1)}px) rotate(-90deg) scaleX(${ww.dir < 0 ? 1 : -1})`;
}

// ---------- idle remarks ----------
const AMBIENT = [
  "the stairs don't go anywhere. they're very committed to it.",
  'three of them have been climbing since before you got here.',
  "every step is up. you can drag it around and check. it's not.",
  'the doors work. click one. you will regret the ceiling one.',
  'the exit is at the bottom of the stairs. so is the top.',
];
const pageStart = performance.now();
let nextAmbient = performance.now() + 24000;
function ambient(now) {
  if (now < nextAmbient) return;
  nextAmbient = now + 26000 + Math.random() * 10000;
  if (now - lastSay < 15000 || dragging || broken || rollAnim) return;
  const mins = Math.floor((now - pageStart) / 60000);
  if (mins >= 1 && Math.random() < 0.45) {
    say(`you've been here for ${mins} minute${mins === 1 ? '' : 's'}. everyone is still on the ground floor. including you.`);
  } else {
    say(cycle('ambient', AMBIENT));
  }
}

// ---------- when you leave the tab (see ../assets/away.js) ----------
addEventListener('cizole:return', e => {
  const secs = Math.round(e.detail.awayMs / 1000);
  if (secs < 3) return;
  const span = secs < 120 ? `${secs}s` : `${Math.round(secs / 60)} minutes`;
  say(`you left for ${span}. they kept climbing. you're still on floor 1. they saved your spot.`);
});

// ---------- the loop ----------
let running = true;
let last = performance.now();
let frameNo = 0;
function frame(now) {
  if (!running) return;
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  updateRoll(now);
  updateCamera(dt, now);
  updateYou(now);
  updateWalkers(dt);
  for (const f of walkers) placeFigure(f, now);
  placeFigure(you, now);
  if (renderer) renderer.render(scene, camera);
  if (frameNo++ % 3 === 0) drawWall(now);
  updateWallWalker(dt);
  ambient(now);
  requestAnimationFrame(frame);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    running = false;
    held.clear();
    if (sound && sound.on) sound.ctx.suspend();
  } else if (!running) {
    running = true;
    last = performance.now();
    lastStepAt = performance.now();
    if (sound && sound.on) sound.ctx.resume();
    requestAnimationFrame(frame);
  }
});
let resizeTimer = 0;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(fit, 120);
});

fit();
if (document.fonts) document.fonts.ready.then(fit);
if (!renderer) say('no 3d here. the stairs are imaginary anyway. the doors still work.');
requestAnimationFrame(frame);
window.__escherReady = true;
</script>
<script src="../assets/rooms.js"></script>
<script src="../assets/away.js"></script>
