<style>
  /* the power, reset and channel switches sit on the console's front face */
  .console .power { top: 57%; }
  .console .reset { top: 59%; }
  .console .chan { top: 53%; }

  /* ---------- hud ---------- */
  .hud {
    width: var(--w);
    margin: 12px auto 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }
  .caption, .play-caption { margin: 0; min-height: 2.8em; font-size: 15px; line-height: 1.4; transition: opacity 0.2s; }
  .caption.fade, .play-caption.fade { opacity: 0; }
  .sound {
    flex: none;
    padding: 6px 12px;
    border: 1px solid var(--faint);
    border-radius: 999px;
    background: #1a1916;
    color: var(--dim);
    font: 14px var(--font);
    cursor: pointer;
  }
  .sound.on { border-color: var(--acid); color: var(--acid); }
  .rotate-hint { display: none; width: var(--w); margin: 10px auto 0; color: var(--dim); font-size: 13px; }
  @media (orientation: portrait) and (max-width: 600px) { .rotate-hint { display: block; } }

  /* ---------- the tv, up close ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: grid;
    place-items: center;
    overflow-y: auto;
    padding: 12px;
    background: rgba(8, 7, 6, 0.86);
  }
  .overlay[hidden] { display: none; }
  .play-panel { width: min(760px, 100%); display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .play-top { width: 100%; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .play-caption { font-size: 14px; }
  .close-btn {
    flex: none;
    padding: 6px 12px;
    border: 1px solid #3a372f;
    border-radius: 999px;
    background: #1a1916;
    color: var(--fg);
    font: 14px var(--font);
    cursor: pointer;
  }
  .close-btn:hover { border-color: var(--acid); color: var(--acid); }
  .big-screen {
    position: relative;
    width: min(100%, max(240px, calc((100dvh - 330px) * 256 / 224)), 640px);
    aspect-ratio: 256 / 224;
    overflow: hidden;
    border-radius: 3.5% / 4%;
    background: #000;
    box-shadow: 0 0 0 10px #1c1c1f, 0 0 40px rgba(120, 170, 255, 0.15);
    outline: none;
  }
  .big-screen:focus-visible { box-shadow: 0 0 0 10px #1c1c1f, 0 0 0 13px var(--acid); }
  .ctrl {
    position: relative;
    width: min(440px, 100%);
    aspect-ratio: 2.5;
    border-radius: 60px;
    background: linear-gradient(#3e3f47, #2a2b30);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5), inset 0 2px 0 rgba(255, 255, 255, 0.12);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .ctrl-face { position: absolute; left: 4%; right: 4%; top: 14%; bottom: 14%; border-radius: 48px; background: #1b1b1f; }
  .ctrl button { position: absolute; padding: 0; border: 0; cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent; }
  .ctrl .dpad { width: 10.5%; height: 26%; background: #55565e; }
  .ctrl .dpad.pressed, .ctrl .ab.pressed, .ctrl .ss.pressed { filter: brightness(1.7); }
  .ctrl .up { left: 16%; top: 22%; }
  .ctrl .down { left: 16%; top: 62%; }
  .ctrl .left { left: 5.5%; top: 42%; width: 10.5%; height: 26%; }
  .ctrl .right { left: 26.5%; top: 42%; width: 10.5%; height: 26%; }
  .ctrl .hub { position: absolute; left: 16%; top: 42%; width: 10.5%; height: 26%; background: #55565e; }
  .ctrl .ss {
    top: 58%;
    width: 11%;
    height: 11%;
    border-radius: 999px;
    background: #6f6f76;
    color: transparent;
    font-size: 0;
  }
  .ctrl .sel { left: 41%; }
  .ctrl .sta { left: 55%; }
  .ctrl .ss-label { position: absolute; top: 72%; color: #7fe3d8; font: 9px var(--font); text-transform: uppercase; }
  .ctrl .ab {
    top: 38%;
    width: 11.5%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #ff6fb4, #b01d64);
    box-shadow: 0 3px 0 #5e0f36;
    color: transparent;
    font-size: 0;
  }
  .ctrl .bb { left: 72%; }
  .ctrl .aa { left: 85%; background: radial-gradient(circle at 40% 35%, #6ff0e0, #13907f); box-shadow: 0 3px 0 #0a4a42; }
  .ctrl .ab-label { position: absolute; top: 72%; color: #7fe3d8; font: 700 11px var(--font); }
  .ctrl .brand { position: absolute; left: 41%; top: 26%; color: #7fe3d8; font: 700 12px var(--font); letter-spacing: 0.1em; }
  .keys-hint { margin: 0; color: var(--dim); font-size: 13px; text-align: center; }

  /* ---------- the strategy guide, open ---------- */
  .book {
    position: relative;
    width: min(520px, 100%);
    padding: 28px 26px 20px;
    border-radius: 6px;
    background: #f7f1df;
    color: #221d14;
    box-shadow: 14px 14px 0 #3f2a86, 0 20px 50px rgba(0, 0, 0, 0.6);
  }
  .book h2 { margin: 0 0 14px; font: 14px/1.6 "Press Start 2P", monospace; color: #3f2a86; }
  .book ul { margin: 0; padding-left: 1.2em; font-size: 14px; line-height: 1.55; }
  .book li + li { margin-top: 8px; }
  .book .page-no { position: absolute; top: 10px; left: 26px; margin: 0; color: #8a7f68; font-size: 11px; }
  .book .shut { position: absolute; top: 8px; right: 10px; padding: 4px 10px; border: 1px solid #c9bfa6; border-radius: 999px; background: none; color: #221d14; font: 12px var(--font); cursor: pointer; }
  .book-nav { display: flex; justify-content: space-between; margin-top: 18px; }
  .book-nav button { padding: 6px 12px; border: 1px solid #3f2a86; border-radius: 999px; background: none; color: #3f2a86; font: 14px var(--font); cursor: pointer; }
  .book-nav button:hover { background: #3f2a86; color: #f7f1df; }

  @media (prefers-reduced-motion: reduce) {
    .mote { animation: none; opacity: 0; }
    .cart.blowing, .slot-cart.blowing, .beanbag.squish { animation: none; }
    .puff { animation-duration: 0.01s; }
  }
</style>
</head>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const TAU = Math.PI * 2;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const stage = $('#stage');
  const loadedAt = performance.now();

  const store = {
    get(key, fallback) {
      try {
        const v = localStorage.getItem('cizole.retro.' + key);
        return v === null ? fallback : JSON.parse(v);
      } catch (err) { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem('cizole.retro.' + key, JSON.stringify(value)); } catch (err) { /* storage off */ }
    },
  };

  // ---------- captions (mirrored inside the close-up) ----------
  const captionEls = [$('#caption'), $('#play-caption')];
  let captionTimer;
  function say(text) {
    clearTimeout(captionTimer);
    for (const el of captionEls) el.classList.add('fade');
    captionTimer = setTimeout(() => {
      for (const el of captionEls) {
        el.textContent = text;
        el.classList.remove('fade');
      }
    }, 160);
  }
  const seen = {};
  function cycle(key, lines) {
    const i = seen[key] || 0;
    seen[key] = i + 1;
    return lines[i % lines.length];
  }

  // ---------- audio: nothing is created until someone asks for sound ----------
  const soundBtn = $('#sound');
  const audio = { ctx: null, on: false, master: null, music: null, sfx: null, noise: null, hissNode: null };
  let userMuted = false;

  function initAudio() {
    if (audio.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    const master = ctx.createGain();
    master.gain.value = 0;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16;
    comp.ratio.value = 4;
    master.connect(comp).connect(ctx.destination);
    // a tv speaker: no real bass, no real treble
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 6000;
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 80;
    lp.connect(hp).connect(master);
    const music = ctx.createGain();
    music.gain.value = 0.5;
    music.connect(lp);
    const sfx = ctx.createGain();
    sfx.gain.value = 0.7;
    sfx.connect(lp);
    const noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    Object.assign(audio, { ctx, master, music, sfx, noise });
  }

  function setSound(on) {
    if (on) initAudio();
    audio.on = on && !!audio.ctx;
    soundBtn.textContent = audio.on ? 'sound: on' : 'sound: off';
    soundBtn.classList.toggle('on', audio.on);
    if (!audio.ctx) return;
    if (audio.on) audio.ctx.resume(); // never awaited
    const t = audio.ctx.currentTime;
    audio.master.gain.cancelScheduledValues(t);
    audio.master.gain.setTargetAtTime(audio.on ? 0.8 : 0, t, 0.05);
    syncMusic();
    syncHiss();
  }
  soundBtn.addEventListener('click', () => {
    setSound(!audio.on);
    userMuted = !audio.on;
  });

  function blip(freq, dur, type = 'square', gain = 0.05, when = 0, slideTo = 0) {
    if (!audio.on) return;
    const ctx = audio.ctx;
    const t = ctx.currentTime + when;
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audio.sfx);
    o.start(t);
    o.stop(t + dur + 0.02);
  }
  function noiseBurst(dur, freq = 1200, gain = 0.2, q = 0.7, when = 0, dest = null) {
    if (!audio.on) return;
    const ctx = audio.ctx;
    const t = ctx.currentTime + when;
    const s = ctx.createBufferSource();
    s.buffer = audio.noise;
    s.loop = true;
    const f = ctx.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = freq;
    f.Q.value = q;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + Math.min(0.04, dur / 3));
    g.gain.setValueAtTime(gain, t + Math.max(0.02, dur * 0.6));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(dest || audio.sfx);
    s.start(t, Math.random() * 0.5);
    s.stop(t + dur + 0.05);
  }
  const SFX = {
    jump: () => blip(220, 0.16, 'square', 0.045, 0, 660),
    land: () => blip(120, 0.07, 'triangle', 0.12),
    flake: () => { blip(1320, 0.07, 'square', 0.035); blip(1760, 0.1, 'square', 0.035, 0.06); },
    trick: () => [523, 659, 784, 1047].forEach((f, i) => blip(f, 0.09, 'square', 0.035, i * 0.05)),
    crash: () => { noiseBurst(0.55, 700, 0.4, 0.5); blip(200, 0.45, 'square', 0.04, 0, 45); },
    menu: () => blip(880, 0.04, 'square', 0.035),
    select: () => { blip(660, 0.06, 'square', 0.035); blip(990, 0.1, 'square', 0.035, 0.06); },
    hit: () => blip(440, 0.05, 'square', 0.045),
    wall: () => blip(220, 0.05, 'square', 0.04),
    miss: () => blip(160, 0.3, 'square', 0.045, 0, 70),
    breath: () => noiseBurst(0.9, 900, 0.22, 0.4),
    clunk: () => { blip(90, 0.1, 'triangle', 0.16); noiseBurst(0.05, 3000, 0.08, 1); },
    click: () => blip(1800, 0.015, 'square', 0.03),
    boot: () => blip(1046, 0.12, 'square', 0.03),
    chime: () => [784, 1047, 1319].forEach((f, i) => blip(f, 0.25, 'triangle', 0.08, i * 0.09)),
  };

  // the hiss of a tv showing snow
  function syncHiss() {
    const want = audio.on && !document.hidden && screenIsStatic();
    if (want && !audio.hissNode) {
      const ctx = audio.ctx;
      const s = ctx.createBufferSource();
      s.buffer = audio.noise;
      s.loop = true;
      const f = ctx.createBiquadFilter();
      f.type = 'highpass';
      f.frequency.value = 1500;
      const g = ctx.createGain();
      g.gain.value = 0.0001;
      g.gain.setTargetAtTime(0.035, ctx.currentTime, 0.08);
      s.connect(f).connect(g).connect(audio.sfx);
      s.start();
      audio.hissNode = { s, g };
    } else if (!want && audio.hissNode) {
      const { s, g } = audio.hissNode;
      g.gain.setTargetAtTime(0.0001, audio.ctx.currentTime, 0.05);
      s.stop(audio.ctx.currentTime + 0.3);
      audio.hissNode = null;
    }
  }

  // ---------- chiptune: square lead, triangle bass, noise drums ----------
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const SONGS = {
    powder: {
      bpm: 150,
      steps: 64,
      lead: [
        [0, 76, 2], [2, 79, 2], [4, 84, 4], [8, 83, 2], [10, 79, 2], [12, 76, 4],
        [16, 74, 2], [18, 79, 2], [20, 83, 4], [24, 81, 2], [26, 79, 2], [28, 74, 4],
        [32, 72, 2], [34, 76, 2], [36, 81, 4], [40, 79, 2], [42, 76, 2], [44, 72, 2], [46, 74, 2],
        [48, 77, 2], [50, 76, 2], [52, 72, 2], [54, 77, 2], [56, 76, 3], [59, 74, 1], [60, 74, 4],
      ],
      leadGain: 0.034,
      chords: [[60, 64, 67], [59, 62, 67], [57, 60, 64], [57, 60, 65]],
      arpType: 'square',
      arpGain: 0.012,
      roots: [36, 43, 45, 41],
      bassEvery: 2,
      octave: true,
      bassGain: 0.16,
      drums: 'k.h.s.h.k.h.s.hh',
    },
    aether: {
      bpm: 84,
      steps: 64,
      lead: [
        [0, 74, 6], [6, 77, 2], [8, 76, 4], [12, 72, 4], [16, 74, 8], [24, 70, 8],
        [32, 72, 6], [38, 74, 2], [40, 77, 4], [44, 79, 4], [48, 76, 12], [60, 72, 4],
      ],
      leadGain: 0.022,
      chords: [[62, 65, 69], [58, 62, 65], [60, 65, 69], [60, 64, 67]],
      arpType: 'triangle',
      arpUp: 1,
      arpGain: 0.05,
      roots: [38, 34, 41, 36],
      bassEvery: 16,
      octave: false,
      bassGain: 0.14,
      drums: null,
    },
  };
  for (const s of Object.values(SONGS)) s.leadMap = new Map(s.lead.map(([st, m, len]) => [st, [m, len]]));

  function chipNote(type, freq, t, dur, gain) {
    const ctx = audio.ctx;
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.setValueAtTime(gain, t + dur * 0.75);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audio.music);
    o.start(t);
    o.stop(t + dur + 0.02);
  }
  function chipNoise(t, dur, type, freq, gain) {
    const ctx = audio.ctx;
    const s = ctx.createBufferSource();
    s.buffer = audio.noise;
    const f = ctx.createBiquadFilter();
    f.type = type;
    f.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(audio.music);
    s.start(t, Math.random() * 0.5);
    s.stop(t + dur + 0.02);
  }
  function playStep(song, s, t, stepDur) {
    const bar = Math.floor(s / 16) % song.chords.length;
    const sb = s % 16;
    const lead = song.leadMap.get(s);
    if (lead) chipNote('square', mtof(lead[0]), t, lead[1] * stepDur * 0.92, song.leadGain);
    const ch = song.chords[bar];
    chipNote(song.arpType, mtof(ch[s % 3] + 12 * (song.arpUp || 0)), t, stepDur * 0.85, song.arpGain);
    if (sb % song.bassEvery === 0) {
      const oct = song.octave && (sb / song.bassEvery) % 2 === 1 ? 12 : 0;
      chipNote('triangle', mtof(song.roots[bar] + oct), t, stepDur * song.bassEvery * 0.9, song.bassGain);
    }
    if (song.drums) {
      const d = song.drums[sb];
      if (d === 'k') chipNoise(t, 0.09, 'lowpass', 300, 0.5);
      else if (d === 's') chipNoise(t, 0.12, 'bandpass', 1800, 0.3);
      else if (d === 'h') chipNoise(t, 0.03, 'highpass', 7000, 0.12);
    }
  }

  const music = { want: null, song: null, step: 0, nextT: 0, timer: null };
  function playSong(name) {
    music.want = name;
    syncMusic();
  }
  function stopScheduler() {
    clearInterval(music.timer);
    music.timer = null;
    music.song = null;
  }
  function syncMusic() {
    const want = audio.on && !document.hidden ? music.want : null;
    if (want === music.song) return;
    stopScheduler();
    if (!want || !audio.ctx) return;
    music.song = want;
    music.step = 0;
    music.nextT = audio.ctx.currentTime + 0.08;
    music.timer = setInterval(schedule, 25);
  }
  function schedule() {
    const song = SONGS[music.song];
    if (!song || !audio.ctx) return;
    const now = audio.ctx.currentTime;
    if (music.nextT < now - 0.2) music.nextT = now + 0.05; // woke up late: don't play catch-up
    const stepDur = 60 / song.bpm / 4;
    while (music.nextT < now + 0.12) {
      playStep(song, music.step % song.steps, music.nextT, stepDur);
      music.nextT += stepDur;
      music.step++;
    }
  }

  // ---------- the picture: everything draws into one 256x224 framebuffer ----------
  const W = 256;
  const H = 224;
  const fb = document.createElement('canvas');
  fb.width = W;
  fb.height = H;
  const g = fb.getContext('2d');
  const tvCtx = $('#tv').getContext('2d');
  const bigCtx = $('#big').getContext('2d');
  for (const c of [g, tvCtx, bigCtx]) c.imageSmoothingEnabled = false;
  const FONT = '"Press Start 2P", monospace';
  try { document.fonts.load('8px "Press Start 2P"').catch(() => {}); } catch (err) { /* the fallback font will do */ }

  function text(str, x, y, color = '#fff', align = 'left', size = 8) {
    g.font = `${size}px ${FONT}`;
    g.textAlign = align;
    g.textBaseline = 'top';
    g.fillStyle = color;
    g.fillText(str, Math.round(x), Math.round(y));
  }
  function shadowText(str, x, y, color, shadow = '#000', align = 'left', size = 8) {
    text(str, x + 1, y + 1, shadow, align, size);
    text(str, x, y, color, align, size);
  }
  function rect(x, y, w, h, color) {
    g.fillStyle = color;
    g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  }
  const blinkOn = (now, hz = 1) => Math.floor(now / (500 / hz)) % 2 === 0;
  // seeded random: garbage should stay the same garbage for a moment
  function rng(seed) {
    let s = seed >>> 0;
    return () => {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // snow: what channel 3 looks like when nothing is on channel 3
  const snow = document.createElement('canvas');
  snow.width = 128;
  snow.height = 112;
  const snowCtx = snow.getContext('2d');
  const snowImg = snowCtx.createImageData(128, 112);
  let snowAt = -1e9;
  function drawStatic(now) {
    if (now - snowAt > (reduceMotion ? 250 : 50)) {
      snowAt = now;
      const d = snowImg.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = Math.random() * 230;
        d[i] = v;
        d[i + 1] = v;
        d[i + 2] = v + 12;
        d[i + 3] = 255;
      }
      snowCtx.putImageData(snowImg, 0, 0);
    }
    g.drawImage(snow, 0, 0, W, H);
  }

  // a cartridge that isn't seated right shows one of these
  const GLITCH_PAL = ['#ff6ec7', '#2323ff', '#00c46a', '#ffd400', '#ffffff', '#8a00c4', '#ff4a00', '#5ef0ff'];
  const junk = document.createElement('canvas');
  junk.width = W;
  junk.height = H;
  const junkCtx = junk.getContext('2d');
  let junkKey = '';
  let junkTitle = '';
  function newGlitch(cartIndex) {
    return {
      style: pick(['solid', 'garbage', 'stripes', 'garbled']),
      c1: pick(GLITCH_PAL),
      c2: pick(GLITCH_PAL),
      seed: Math.floor(Math.random() * 1e9),
      cart: cartIndex,
    };
  }
  function scramble(str, r) {
    return [...str].map(ch => (ch !== ' ' && r() < 0.4 ? pick('@#%&?!*$') : ch)).join('');
  }
  function drawGlitch(gl, now) {
    const tick = Math.floor(now / (reduceMotion ? 1400 : 700));
    const key = gl.seed + ':' + tick;
    if (key !== junkKey) {
      junkKey = key;
      const r = rng(gl.seed + tick * 7919);
      const j = junkCtx;
      if (gl.style === 'solid') {
        j.fillStyle = gl.c1;
        j.fillRect(0, 0, W, H);
        j.fillStyle = gl.c2;
        j.fillRect(0, (tick * 37) % H, W, 14);
      } else if (gl.style === 'stripes') {
        for (let x = 0; x < W; x += 16) {
          j.fillStyle = GLITCH_PAL[Math.floor(r() * GLITCH_PAL.length)];
          j.fillRect(x + Math.floor(r() * 6) - 3, 0, 17, H);
        }
      } else {
        j.fillStyle = '#000';
        j.fillRect(0, 0, W, H);
        const pal = [gl.c1, gl.c2, '#000', '#fff'];
        for (let ty = 0; ty < 28; ty++) {
          for (let tx = 0; tx < 32; tx++) {
            if (r() < 0.35) continue;
            j.fillStyle = pal[Math.floor(r() * 4)];
            const bits = Math.floor(r() * 65536);
            for (let b = 0; b < 16; b++) {
              if (bits & (1 << b)) j.fillRect(tx * 8 + (b % 4) * 2, ty * 8 + Math.floor(b / 4) * 2, 2, 2);

          }

      }
      junkTitle = gl.style === 'garbled' ? scramble(CARTS[gl.cart].title, r) : '';
    }
    g.drawImage(junk, 0, 0);
    if (junkTitle) shadowText(junkTitle, W / 2, 100, gl.c1, '#000', 'center', 8);
  }

  // ---------- the controller ----------
  const held = { up: 0, down: 0, left: 0, right: 0, a: 0, b: 0, start: 0, select: 0 };
  const tapped = new Set();
  const btn = name => held[name] > 0;
  const tap = name => tapped.has(name);
  function pressBtn(name) {
    if (!held[name]) tapped.add(name);
    held[name]++;
  }
  function releaseBtn(name) { held[name] = Math.max(0, held[name] - 1); }
  const keysDown = new Map(); // key code -> button
  const touchDown = new Map(); // pointer id -> button element
  function releaseAll() {
    for (const k in held) held[k] = 0;
    keysDown.clear();
    for (const el of touchDown.values()) el.classList.remove('pressed');
    touchDown.clear();
  }

  const KEYS = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right',
    KeyX: 'a', Space: 'a', KeyZ: 'b',
    Enter: 'start', NumpadEnter: 'start', ShiftLeft: 'select', ShiftRight: 'select',
  };
  const playWrap = $('#play-wrap');
  const guideWrap = $('#guide-wrap');
  const bigScreen = $('#big-screen');
  const isTyping = el => !!el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));

  function gameKeysLive(target, code) {
    if (isTyping(target) || !guideWrap.hidden) return false;
    const onButton = target && target.closest && target.closest('button');
    const activates = code === 'Enter' || code === 'NumpadEnter' || code === 'Space';
    if (!playWrap.hidden) return !(onButton && activates);
    // in the room, the keys only drive the console while something is running
    if (con.mode !== 'game') return false;
    if (target === document.body || target === document.documentElement) return true;
    return (target === $('#tv-btn') || target === $('#pad1')) && !activates;
  }

  addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (!guideWrap.hidden) { closeGuide(); return; }
      if (!playWrap.hidden) { closePlay(); return; }
    }
    const b = KEYS[e.code];
    if (!b || e.ctrlKey || e.metaKey || e.altKey) return;
    if (!gameKeysLive(e.target, e.code)) return;
    e.preventDefault(); // no page scrolling while playing
    if (e.repeat || keysDown.has(e.code)) return;
    keysDown.set(e.code, b);
    pressBtn(b);
  });

    keysDown.delete(e.code);

    touchDown.set(e.pointerId, el);
    el.classList.add('pressed');
    pressBtn(el.dataset.btn);
  });
  function lift(e) {
    const el = touchDown.get(e.pointerId);
    if (!el) return;

  // ---------- cartridge 1: POWDER DAY ----------
  const pad6 = n => String(Math.min(999999, Math.max(0, Math.floor(n)))).padStart(6, '0');
  const SLOPE = 0.32;
  const ground = x => x * SLOPE + Math.sin(x * 0.013) * 9 + Math.sin(x * 0.041 + 1) * 3;
  const groundSlope = x => SLOPE + Math.cos(x * 0.013) * 0.117 + Math.cos(x * 0.041 + 1) * 0.123;
  let batteryArmed = true; // once per visit, the save battery "dies"

  function makeCanvas(w, h, draw) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const x = c.getContext('2d');
    draw(x, (col, a, b, cw, ch) => { x.fillStyle = col; x.fillRect(a, b, cw, ch); });
    return c;
  }
  function disc(p, cx, cy, r, col) {
    for (let y = -r; y <= r; y++) {
      const half = Math.floor(Math.sqrt(r * r - y * y));
      p(col, cx - half, cy + y, half * 2 + 1, 1);
    }
  }
  function tile(img, offset, y) {
    const w = img.width;
    const x = -(((offset % w) + w) % w);
    g.drawImage(img, x, y);
    g.drawImage(img, x + w, y);
  }

  let powderArt = null;
  function getPowderArt() {
    if (powderArt) return powderArt;
    const sky = makeCanvas(W, H, (x, p) => {
      const bands = ['#1d3a8a', '#2a55b0', '#3d74cc', '#5b93de', '#86b5ec', '#b7d6f5'];
      bands.forEach((col, i) => p(col, 0, i * 22, W, 22));
      p(bands[bands.length - 1], 0, bands.length * 22, W, H);
      for (let i = 1; i < bands.length; i++) {
        for (let y = i * 22 - 4; y < i * 22; y += 2) {
          for (let xx = (y / 2) % 2 ? 0 : 1; xx < W; xx += 2) p(bands[i], xx, y, 1, 1);
        }
      }
      disc(p, 196, 38, 13, '#fff1b8');
      disc(p, 196, 38, 10, '#fffbe6');
    });
    const range = (w, h, seed, base, cap, capLine) => makeCanvas(w, h, (x, p) => {
      const r = rng(seed);
      const heights = [];
      let y = h * 0.5;
      for (let i = 0; i <= w; i += 8) {
        y = clamp(y + (r() - 0.5) * 22, h * 0.15, h * 0.85);
        heights.push(y);
      }
      heights[heights.length - 1] = heights[0]; // seamless when tiled
      for (let xx = 0; xx < w; xx++) {
        const i = Math.floor(xx / 8);
        const f = (xx % 8) / 8;
        const top = Math.round(heights[i] * (1 - f) + heights[Math.min(i + 1, heights.length - 1)] * f);
        p(base, xx, top, 1, h - top);
        if (top < h * capLine) p(cap, xx, top, 1, Math.max(1, Math.round(h * capLine) - top));

        p('#ffd83d', 8, 15, 8, 1);
        p('#25d0c2', 4, 15, 4, 2);
        p('#25d0c2', 16, 15, 4, 2);
        p('#ffcf99', 9, 9, 6, 4);
        p('#ff8a1f', 9, 8, 6, 2);
        p('#1c1c1c', 10, 10, 5, 1);
        p('#ffd83d', 11, 10, 3, 1);
        return;
      }
      const dy = pose === 'air' ? 2 : 0;
      p('#3b3b8f', 8, 14 + dy, 3, 5 - dy);
      p('#3b3b8f', 13, 14 + dy, 3, 5 - dy);
      p('#3b3b8f', 8, 13 + dy, 8, 2);
      p('#25d0c2', 8, 7 + dy, 8, 6);
      p('#ffd83d', 8, 10 + dy, 8, 1);
      if (pose === 'air') {

        p('#25d0c2', 16, 4, 3, 5);
        p('#1c1c1c', 5, 3, 3, 1);

        p('#25d0c2', 16, 8, 4, 2);
        p('#1c1c1c', 3, 8, 1, 2);
        p('#1c1c1c', 20, 8, 1, 2);

      p('#ff8a1f', 9, 1 + dy, 6, 2);

      p('#ffd83d', 11, 4 + dy, 3, 1);
    });
    powderArt = { sky, far, near, ride: rider('ride'), duck: rider('duck'), air: rider('air') };
    return powderArt;
  }

  function makePowder() {
    const art = getPowderArt();
    const GRAV = 620;
    const JUMP = 215;
    const SPIN_TIME = 0.45;
    let state = 'title';
    let t = 0;
    let best = store.get('powder.best', 0);
    let gagT = 0;
    let P, objs, parts, msgs, score, flakes, dist, speed, camX, camY, nextSpawn, crashCause, newBest, paused;

    function reset(demo) {

      objs = [];

    function follow() {

    function popMsg(textStr, color = '#ffd83d') { msgs.push({ text: textStr, x: P.x, y: P.y - 30, t: 0, color }); }
    function sparkle(x, y, n = 6, color = '#ffffff') {
      for (let i = 0; i < n; i++) parts.push({ x, y, vx: rand(-40, 40), vy: rand(-70, 10), life: rand(0.3, 0.6), color });
    }

    function spawn(x) {
      const r = Math.random();
      if (r < 0.28) objs.push({ k: 'rock', x, w: 12, h: 8 });
      else if (r < 0.46) objs.push({ k: 'log', x, w: 22, h: 6 });
      else if (r < 0.64 && t > 5) objs.push({ k: 'branch', x, w: 34, lift: 14, h: 4 });
      else if (r < 0.76) {

      }
    }

    const CRASH_LINES = {
      rock: ['you hit a rock. the rock was there first.', 'a rock. it has been sitting there since the ice age. it can wait.'],
      log: ['a log. you could have jumped. the log knows it.', 'you hit a log. it did not move. logs rarely do.'],

    function land() {
      const left = P.spinTarget - P.spin;
