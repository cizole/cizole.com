<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cizole</title>
<link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
  main {
    min-height: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .wordmark {
    margin: 0;
    font-size: clamp(64px, 18vw, 160px);
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1;
    white-space: nowrap;
    user-select: none;
  }
  .wordmark span { display: inline-block; will-change: transform; }
  .tagline {
    align-self: flex-start;
    margin: 16px 0 56px;
    padding: 0;
    min-height: 1.5em;
    border: 0;
    background: none;
    color: var(--dim);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .tagline::after { content: "_"; animation: caret 1s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0; } }
  /* the room list, built from assets/rooms.js */
  .exhibits { list-style: none; margin: 0; padding: 0; }
  .exhibits li { border-top: 1px solid var(--faint); }
  .exhibits li:last-child { border-bottom: 1px solid var(--faint); }
  .exhibits a {
    display: flex;
    align-items: baseline;
    gap: 20px;
    padding: 18px 4px;
    color: var(--fg);
    text-decoration: none;
  }
  .exhibits a:hover { color: var(--acid); }
  .num { color: var(--dim); font-size: 14px; }
  .name { font-size: 20px; font-weight: 700; }
  .blurb { position: relative; margin-left: auto; color: var(--dim); font-size: 15px; text-align: right; }
  /* "you were just here" and the management's pick hang under the blurb, in the row's
     padding, so those rows stay the same height as the rest */
  .tags {
    position: absolute;
    top: 100%;
    right: 0;
    margin-top: -2px;
    color: var(--acid);
    font-size: 13px;
    line-height: 1;
    white-space: nowrap;
  }
  /* retired rooms keep their number, and a reason */
  .exhibits .closed {
    display: flex;
    align-items: baseline;
    gap: 20px;
    padding: 18px 4px;
    cursor: not-allowed;
  }
  .closed .num { color: #5a564c; }
  .closed .name { color: #736e62; text-decoration: line-through; text-decoration-thickness: 2px; }
  .closed .blurb { color: #8f8a7c; font-style: italic; }
  .stamp {
    align-self: center;
    padding: 1px 7px;
    border: 1px solid #7a3a31;
    border-radius: 3px;
    color: #c0574a;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    transform: rotate(-4deg);
  }
  footer { margin-top: 56px; color: #6a655a; font-size: 13px; }
  /* where 023 would be: an empty row. it says so if you look. */
  .gap-row {
    /* laid out exactly like a room link, so the row is the same height */
    display: flex;
    align-items: baseline;
    gap: 20px;
    padding: 18px 4px;
    opacity: 0;
    cursor: help;
    transition: opacity 0.4s;
  }
  .gap-row:hover, .gap-row:focus-visible { opacity: 1; outline: none; }
  .gap-row .num, .gap-row .blurb { color: #6a655a; }
  /* the secret room, the moment it's found */
  .found a { animation: found 2.4s ease-out; }
  @keyframes found {
    0% { background: rgba(200, 255, 61, 0.25); }
    100% { background: none; }
  }
  @media (max-width: 520px) {
    .exhibits a, .exhibits .closed { flex-wrap: wrap; row-gap: 4px; }
    .blurb { flex-basis: 100%; margin-left: 0; text-align: left; }
    .tags { right: auto; left: 0; }
  }
</style>
</head>
<body>
<main>
  <h1 class="wordmark" id="wordmark" aria-label="cizole">cizole</h1>
  <button class="tagline" id="tagline" type="button"></button>
  <ul class="exhibits" id="rooms"></ul>
  <footer>more rooms are being dug.</footer>
</main>
<script src="assets/rooms.js"></script>
<script>
// The room list comes from assets/rooms.js, the same list every room's menu uses.
(() => {
  const rooms = window.CIZOLE_ROOMS || [];
  let last = null;
  try { last = sessionStorage.getItem('cizole.last-room'); } catch (err) { /* storage off */ }
  const span = (cls, text) => {
    const s = document.createElement('span');
    s.className = cls;
    s.textContent = text;
    return s;
  };
  const visited = window.CIZOLE_VISITED || [];
  const list = document.getElementById('rooms');
  const footer = document.querySelector('footer');
  let lastRow = null;
  function row(r) {
    const li = document.createElement('li');
    if (r.defunct) {
      const closed = document.createElement('div');
      closed.className = 'closed';
      closed.title = 'this room is closed';
      closed.append(span('num', r.n), span('name', r.name), span('stamp', 'closed'), span('blurb', r.defunct));
      li.appendChild(closed);
      return li;
    }
    const a = document.createElement('a');
    a.href = r.slug + '/';
    const blurb = span('blurb', r.blurb);
    const tags = [];
    if (r.featured) tags.push('recommended by management');
    if (r.slug === last) {
      a.classList.add('last');
      lastRow = li;
      tags.push('you were just here');
    }
    if (tags.length) blurb.appendChild(span('tags', tags.join('  ·  ')));
    a.append(span('num', r.n), span('name', r.name), blurb);
    if (visited.includes(r.slug)) a.classList.add('seen');
    li.appendChild(a);
    return li;
  }
  // a secret room that isn't unlocked yet leaves an empty row where it would be
  const gaps = {};
  function gapRow(r) {
    const li = document.createElement('li');
    const div = document.createElement('div');
    div.className = 'gap-row';
    div.setAttribute('role', 'button');
    div.tabIndex = 0;
    div.setAttribute('aria-label', `there is no ${r.n}`);
    div.append(span('num', r.n), span('name', ' '), span('blurb', `(there is no ${r.n}.)`));
    const hint = () => window.dispatchEvent(new CustomEvent('cizole:hint'));
    div.addEventListener('click', hint);
    div.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); hint(); } });
    li.appendChild(div);
    gaps[r.slug] = li;
    return li;
  }
  for (const r of (window.CIZOLE_ALL_ROOMS || rooms)) {
    list.appendChild(r.hidden && !rooms.includes(r) ? gapRow(r) : row(r));
  }

  // the stamp card
  const open = rooms.filter(r => !r.defunct);
  const seen = open.filter(r => visited.includes(r.slug)).length;
  if (seen === 0) footer.textContent = 'more rooms are being dug.';
  else if (seen >= open.length) footer.textContent = "you've been in all of them. there is no prize. the prize was the rooms.";
  else footer.textContent = `more rooms are being dug. you've been in ${seen} of ${open.length}.`;

  // back from a room: the lobby is scrolled exactly where you left it (per tab, so a
  // fresh visit still starts at the top). the list is already built, so this lands
  // before the first paint instead of jumping after it.
  const SCROLL_KEY = 'cizole.lobby-scroll';
  addEventListener('pagehide', () => {
    try { sessionStorage.setItem(SCROLL_KEY, String(Math.round(scrollY))); } catch (err) { /* storage off */ }
  });
  let savedY = null;
  try { savedY = sessionStorage.getItem(SCROLL_KEY); } catch (err) { /* storage off */ }
  if (savedY !== null && Number.isFinite(+savedY)) {
    const y = +savedY;
    scrollTo(0, y);
    // late fonts can nudge the rows; put it back unless you've already scrolled
    if (document.fonts) document.fonts.ready.then(() => { if (Math.abs(scrollY - y) < 40) scrollTo(0, y); });
  }
  // if you walked a few rooms over with < and >, the one you were just in may be off screen
  if (lastRow) {
    addEventListener('load', () => {
      const r = lastRow.getBoundingClientRect();
      if (r.top < 0 || r.bottom > innerHeight) lastRow.scrollIntoView({ block: 'center' });
    });
  }

  // up up down down left right left right b a: the other list
  const KONAMI = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
  let at = 0;
  function feed(key) {
    at = key === KONAMI[at] ? at + 1 : key === KONAMI[0] ? 1 : 0;
    if (at < KONAMI.length) return;
    at = 0;
    try { localStorage.setItem('cizole.nothing', '1'); } catch (err) { /* storage off */ }
    const all = window.CIZOLE_ALL_ROOMS || [];
    for (const r of all) {
      if (!r.hidden || rooms.includes(r)) continue;
      rooms.push(r);
      const li = row(r);
      li.classList.add('found');
      // the empty row becomes the real one
      if (gaps[r.slug]) list.replaceChild(li, gaps[r.slug]);
      else list.appendChild(li);
      li.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
    window.dispatchEvent(new CustomEvent('cizole:konami'));
  }
  addEventListener('keydown', e => feed(e.key.length === 1 ? e.key.toLowerCase() : e.key));
  // phones have no arrow keys: swipes are arrows, and two taps are b and a
  let touch = null;
  addEventListener('touchstart', e => { if (e.touches.length === 1) touch = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }, { passive: true });
  addEventListener('touchend', e => {
    if (!touch || !e.changedTouches.length) return;
    const dx = e.changedTouches[0].clientX - touch.x, dy = e.changedTouches[0].clientY - touch.y;
    touch = null;
    if (Math.hypot(dx, dy) < 40) { if (at === 8) feed('b'); else if (at === 9) feed('a'); return; }
    feed(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'ArrowRight' : 'ArrowLeft') : (dy > 0 ? 'ArrowDown' : 'ArrowUp'));
  }, { passive: true });

  // for whoever opens the console
  console.log('%c c ', 'font: bold 40px monospace; background: #c8ff3d; color: #0e0d0b; padding: 6px 14px; border-radius: 10px;');
  console.log('%cyou opened the console. there is nothing in here. the rooms are out there.', 'color: #8a8475; font: 13px monospace;');
  console.log('%c(fine. one thing: up up down down left right left right b a. in the lobby.)', 'color: #4a463d; font: 12px monospace;');
})();
</script>
<script>
// Wordmark letters dodge the cursor, then spring back home.
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mark = document.getElementById('wordmark');
  const chars = [...mark.textContent];
  mark.textContent = '';
  const letters = chars.map(ch => {
    const el = document.createElement('span');
    el.textContent = ch;
    el.setAttribute('aria-hidden', 'true');
    mark.appendChild(el);
    return { el, x: 0, y: 0, vx: 0, vy: 0, hx: 0, hy: 0, phase: Math.random() * Math.PI * 2 };
  });

  function measure() {
    for (const l of letters) {
      l.el.style.transform = '';
      const r = l.el.getBoundingClientRect();
      l.hx = r.left + r.width / 2 + scrollX;
      l.hy = r.top + r.height / 2 + scrollY;
    }
  }

  let px = -1e4, py = -1e4;
  addEventListener('pointermove', e => { px = e.clientX + scrollX; py = e.clientY + scrollY; });
  document.documentElement.addEventListener('pointerleave', () => { px = py = -1e4; });
  addEventListener('resize', measure);
  document.fonts.ready.then(measure);
  measure();

  // back from another tab: the letters were not where they're supposed to be
  addEventListener('cizole:return', e => {
    if (e.detail.awayMs < 4000) return;
    for (const l of letters) {
      l.x = (Math.random() - 0.5) * 400;
      l.y = (Math.random() - 0.5) * 240;
    }
  });

  const RANGE = 150;
  function tick(t) {
    for (const l of letters) {
      const dx = l.hx + l.x - px, dy = l.hy + l.y - py;
      const d = Math.hypot(dx, dy) || 1;
      if (d < RANGE) {
        const f = (1 - d / RANGE) * 2.4;
        l.vx += dx / d * f;
        l.vy += dy / d * f;
      }
      // every so often a letter hops for no reason
      if (!reduce && Math.random() < 0.0008) l.vy -= 7;
      l.vx = (l.vx - l.x * 0.06) * 0.82;
      l.vy = (l.vy - l.y * 0.06) * 0.82;
      l.x += l.vx;
      l.y += l.vy;
      const wobble = reduce ? 0 : Math.sin(t / 380 + l.phase) * 2.5;
      l.el.style.transform = `translate(${l.x.toFixed(2)}px, ${(l.y + wobble).toFixed(2)}px) rotate(${(l.x * 0.4).toFixed(2)}deg)`;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

// Tagline types itself out; click it for another one.
(() => {
  const LINES = [
    'a website. allegedly.',
    'now with 40% more website.',
    'please do not feed the pages.',
    'under construction since forever.',
    "you weren't supposed to find this.",
    'the pages here are mostly harmless.',
    'best viewed with your eyes.',
    'no cookies. we ate them.',
    'hand-assembled from loose pixels.',
  ];
  // once in a while, one of these instead
  const RARE = [
    'the button says hi. it does not mean it.',
    'gary the fish has seen things. this is one of them.',
    'dustin cleaned this page. you can tell.',
    'the basement is longer than it was.',
    "you've been here before. the eyes remember.",
    'there is no room 023.',
  ];
  const tag = document.getElementById('tagline');
  let idx = Math.floor(Math.random() * LINES.length);
  let typing;

  function type(text) {
    clearInterval(typing);
    let i = 0;
    tag.textContent = '';
    typing = setInterval(() => {
      tag.textContent = text.slice(0, ++i);
      if (i >= text.length) clearInterval(typing);
    }, 38);
  }

  addEventListener('cizole:return', e => {
    if (e.detail.awayMs > 4000) type("welcome back. we didn't touch anything.");
  });
  addEventListener('cizole:konami', () => type('you found the other list.'));
  addEventListener('cizole:hint', () => type('there is no 023. there never was. up, up, down, down. you know the rest.'));

  // the lobby notices if you just stand there
  let idle;
  function watch() {
    clearTimeout(idle);
    idle = setTimeout(() => type(pick(['still here?', 'the rooms are that way. any of them.', 'take your time. the pages will wait. they have to.'])), 90000);
  }
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  for (const ev of ['pointermove', 'keydown', 'scroll', 'pointerdown']) addEventListener(ev, watch, { passive: true });
  watch();

  tag.addEventListener('click', () => {
    if (Math.random() < 0.08) { type(pick(RARE)); return; }
    idx = (idx + 1 + Math.floor(Math.random() * (LINES.length - 1))) % LINES.length;
    type(LINES[idx]);
  });
  const hour = new Date().getHours();
  type(hour >= 2 && hour < 5 ? "it's late. the rooms are still open. they don't sleep either." : Math.random() < 0.03 ? pick(RARE) : LINES[idx]);
})();
</script>
<script src="assets/away.js"></script>
</body>
</html>
