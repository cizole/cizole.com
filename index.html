<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cizole</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
  main {
    min-height: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .wordmark {
    margin: 0;
    font-size: clamp(64px, 18vw, 160px);
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1;
    white-space: nowrap;
    user-select: none;
  }
  .wordmark span { display: inline-block; will-change: transform; }
  .tagline {
    align-self: flex-start;
    margin: 16px 0 56px;
    padding: 0;
    min-height: 1.5em;
    border: 0;
    background: none;
    color: var(--dim);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .tagline::after { content: "_"; animation: caret 1s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0; } }
  .exhibits { list-style: none; margin: 0; padding: 0; }
  .exhibits li { border-top: 1px solid var(--faint); }
  .exhibits li:last-child { border-bottom: 1px solid var(--faint); }
  .exhibits a {
    display: flex;
    align-items: baseline;
    gap: 20px;
    padding: 18px 4px;
    color: var(--fg);
    text-decoration: none;
  }
  .exhibits a:hover { color: var(--acid); }
  .num { color: var(--dim); font-size: 13px; }
  .name { font-size: 20px; font-weight: 700; }
  .blurb { margin-left: auto; color: var(--dim); font-size: 14px; text-align: right; }
  footer { margin-top: 56px; color: #4a463d; font-size: 12px; }
  @media (max-width: 520px) {
    .exhibits a { flex-wrap: wrap; row-gap: 4px; }
    .blurb { flex-basis: 100%; margin-left: 0; text-align: left; }
  }
</style>
</head>
<body>
<main>
  <h1 class="wordmark" id="wordmark" aria-label="cizole">cizole</h1>
  <button class="tagline" id="tagline" type="button"></button>
  <ul class="exhibits">
    <li><a href="eyes/"><span class="num">001</span><span class="name">eyes</span><span class="blurb">they're watching</span></a></li>
    <li><a href="button/"><span class="num">002</span><span class="name">the button</span><span class="blurb">it doesn't want this</span></a></li>
    <li><a href="trip/"><span class="num">003</span><span class="name">trip</span><span class="blurb">don't stare too long</span></a></li>
    <li><a href="escape/"><span class="num">004</span><span class="name">escape room</span><span class="blurb">there's a way out. probably.</span></a></li>
    <li><a href="server-room/"><span class="num">005</span><span class="name">server room</span><span class="blurb">please don't touch anything</span></a></li>
    <li><a href="funky-town/"><span class="num">006</span><span class="name">funky town</span><span class="blurb">population: you</span></a></li>
  </ul>
  <footer>more rooms are being dug.</footer>
</main>
<script>
// Wordmark letters dodge the cursor, then spring back home.
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mark = document.getElementById('wordmark');
  const chars = [...mark.textContent];
  mark.textContent = '';
  const letters = chars.map(ch => {
    const el = document.createElement('span');
    el.textContent = ch;
    el.setAttribute('aria-hidden', 'true');
    mark.appendChild(el);
    return { el, x: 0, y: 0, vx: 0, vy: 0, hx: 0, hy: 0, phase: Math.random() * Math.PI * 2 };
  });

  function measure() {
    for (const l of letters) {
      l.el.style.transform = '';
      const r = l.el.getBoundingClientRect();
      l.hx = r.left + r.width / 2 + scrollX;
      l.hy = r.top + r.height / 2 + scrollY;
    }
  }

  let px = -1e4, py = -1e4;
  addEventListener('pointermove', e => { px = e.clientX + scrollX; py = e.clientY + scrollY; });
  document.documentElement.addEventListener('pointerleave', () => { px = py = -1e4; });
  addEventListener('resize', measure);
  document.fonts.ready.then(measure);
  measure();

  const RANGE = 150;
  function tick(t) {
    for (const l of letters) {
      const dx = l.hx + l.x - px, dy = l.hy + l.y - py;
      const d = Math.hypot(dx, dy) || 1;
      if (d < RANGE) {
        const f = (1 - d / RANGE) * 2.4;
        l.vx += dx / d * f;
        l.vy += dy / d * f;
      }
      // every so often a letter hops for no reason
      if (!reduce && Math.random() < 0.0008) l.vy -= 7;
      l.vx = (l.vx - l.x * 0.06) * 0.82;
      l.vy = (l.vy - l.y * 0.06) * 0.82;
      l.x += l.vx;
      l.y += l.vy;
      const wobble = reduce ? 0 : Math.sin(t / 380 + l.phase) * 2.5;
      l.el.style.transform = `translate(${l.x.toFixed(2)}px, ${(l.y + wobble).toFixed(2)}px) rotate(${(l.x * 0.4).toFixed(2)}deg)`;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

// Tagline types itself out; click it for another one.
(() => {
  const LINES = [
    'a website. allegedly.',
    'now with 40% more website.',
    'please do not feed the pages.',
    'under construction since forever.',
    "you weren't supposed to find this.",
    'the pages here are mostly harmless.',
    'best viewed with your eyes.',
    'no cookies. we ate them.',
    'hand-assembled from loose pixels.',
  ];
  const tag = document.getElementById('tagline');
  let idx = Math.floor(Math.random() * LINES.length);
  let typing;

  function type(text) {
    clearInterval(typing);
    let i = 0;
    tag.textContent = '';
    typing = setInterval(() => {
      tag.textContent = text.slice(0, ++i);
      if (i >= text.length) clearInterval(typing);
    }, 38);
  }

  tag.addEventListener('click', () => {
    idx = (idx + 1 + Math.floor(Math.random() * (LINES.length - 1))) % LINES.length;
    type(LINES[idx]);
  });
  type(LINES[idx]);
})();
</script>
</body>
</html>
