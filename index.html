<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cizole</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
  main {
    min-height: 100%;
    max-width: 980px;
    margin: 0 auto;
    padding: 48px 24px 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .wordmark {
    margin: 0;
    font-size: clamp(64px, 15vw, 150px);
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1;
    white-space: nowrap;
    user-select: none;
  }
  .wordmark span { display: inline-block; will-change: transform; }
  .tagline {
    align-self: flex-start;
    margin: 14px 0 36px;
    padding: 0;
    min-height: 1.5em;
    border: 0;
    background: none;
    color: var(--dim);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .tagline::after { content: "_"; animation: caret 1s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0; } }
  /* the room grid, built from assets/rooms.js */
  .featured, .room {
    display: grid;
    grid-template-columns: 2.6em 1fr;
    align-content: start;
    column-gap: 10px;
    color: var(--fg);
    text-decoration: none;
  }
  .featured .num, .room .num { grid-row: span 3; padding-top: 4px; color: var(--dim); font-size: 13px; }
  .name { font-weight: 700; }
  .blurb { color: var(--dim); }
  .featured {
    margin-bottom: 20px;
    padding: 16px 18px;
    border: 1px solid var(--faint);
    border-left: 3px solid var(--acid);
    border-radius: 6px;
    background: #12110f;
  }
  .featured .name { font-size: 24px; }
  .featured .blurb { font-size: 14px; }
  .featured .note { margin-top: 6px; color: var(--acid); font-size: 12px; }
  .rooms {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    column-gap: 28px;
  }
  .room { padding: 11px 4px; border-top: 1px solid var(--faint); }
  .room .name { font-size: 17px; }
  .room .blurb { font-size: 13px; }
  .featured:hover .name, .room:hover .name, .featured:focus-visible .name, .room:focus-visible .name { color: var(--acid); }
  .last .blurb::after { content: "  \00b7  you were just here"; color: var(--acid); }
  footer { margin-top: 36px; color: #4a463d; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1 class="wordmark" id="wordmark" aria-label="cizole">cizole</h1>
  <button class="tagline" id="tagline" type="button"></button>
  <div id="featured"></div>
  <nav class="rooms" id="rooms" aria-label="rooms"></nav>
  <footer>more rooms are being dug.</footer>
</main>
<script src="assets/rooms.js"></script>
<script>
// The room grid comes from assets/rooms.js, the same list every room's menu uses.
(() => {
  const rooms = window.CIZOLE_ROOMS || [];
  let last = null;
  try { last = sessionStorage.getItem('cizole.last-room'); } catch (err) { /* storage off */ }
  function card(r, cls) {
    const a = document.createElement('a');
    a.className = cls + (r.slug === last ? ' last' : '');
    a.href = r.slug + '/';
    for (const [c, t] of [['num', r.n], ['name', r.name], ['blurb', r.blurb]]) {
      const s = document.createElement('span');
      s.className = c;
      s.textContent = t;
      a.appendChild(s);
    }
    return a;
  }
  const feature = rooms.find(r => r.featured);
  if (feature) {
    const f = card(feature, 'featured');
    const note = document.createElement('span');
    note.className = 'note';
    note.textContent = 'recommended by the management.';
    f.appendChild(note);
    document.getElementById('featured').appendChild(f);
  }
  const list = document.getElementById('rooms');
  for (const r of rooms) if (r !== feature) list.appendChild(card(r, 'room'));
})();
</script>
<script>
// Wordmark letters dodge the cursor, then spring back home.
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mark = document.getElementById('wordmark');
  const chars = [...mark.textContent];
  mark.textContent = '';
  const letters = chars.map(ch => {
    const el = document.createElement('span');
    el.textContent = ch;
    el.setAttribute('aria-hidden', 'true');
    mark.appendChild(el);
    return { el, x: 0, y: 0, vx: 0, vy: 0, hx: 0, hy: 0, phase: Math.random() * Math.PI * 2 };
  });

  function measure() {
    for (const l of letters) {
      l.el.style.transform = '';
      const r = l.el.getBoundingClientRect();
      l.hx = r.left + r.width / 2 + scrollX;
      l.hy = r.top + r.height / 2 + scrollY;
    }
  }

  let px = -1e4, py = -1e4;
  addEventListener('pointermove', e => { px = e.clientX + scrollX; py = e.clientY + scrollY; });
  document.documentElement.addEventListener('pointerleave', () => { px = py = -1e4; });
  addEventListener('resize', measure);
  document.fonts.ready.then(measure);
  measure();

  // back from another tab: the letters were not where they're supposed to be
  addEventListener('cizole:return', e => {
    if (e.detail.awayMs < 4000) return;
    for (const l of letters) {
      l.x = (Math.random() - 0.5) * 400;
      l.y = (Math.random() - 0.5) * 240;
    }
  });

  const RANGE = 150;
  function tick(t) {
    for (const l of letters) {
      const dx = l.hx + l.x - px, dy = l.hy + l.y - py;
      const d = Math.hypot(dx, dy) || 1;
      if (d < RANGE) {
        const f = (1 - d / RANGE) * 2.4;
        l.vx += dx / d * f;
        l.vy += dy / d * f;
      }
      // every so often a letter hops for no reason
      if (!reduce && Math.random() < 0.0008) l.vy -= 7;
      l.vx = (l.vx - l.x * 0.06) * 0.82;
      l.vy = (l.vy - l.y * 0.06) * 0.82;
      l.x += l.vx;
      l.y += l.vy;
      const wobble = reduce ? 0 : Math.sin(t / 380 + l.phase) * 2.5;
      l.el.style.transform = `translate(${l.x.toFixed(2)}px, ${(l.y + wobble).toFixed(2)}px) rotate(${(l.x * 0.4).toFixed(2)}deg)`;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

// Tagline types itself out; click it for another one.
(() => {
  const LINES = [
    'a website. allegedly.',
    'now with 40% more website.',
    'please do not feed the pages.',
    'under construction since forever.',
    "you weren't supposed to find this.",
    'the pages here are mostly harmless.',
    'best viewed with your eyes.',
    'no cookies. we ate them.',
    'hand-assembled from loose pixels.',
  ];
  const tag = document.getElementById('tagline');
  let idx = Math.floor(Math.random() * LINES.length);
  let typing;

  function type(text) {
    clearInterval(typing);
    let i = 0;
    tag.textContent = '';
    typing = setInterval(() => {
      tag.textContent = text.slice(0, ++i);
      if (i >= text.length) clearInterval(typing);
    }, 38);
  }

  addEventListener('cizole:return', e => {
    if (e.detail.awayMs > 4000) type("welcome back. we didn't touch anything.");
  });

  tag.addEventListener('click', () => {
    idx = (idx + 1 + Math.floor(Math.random() * (LINES.length - 1))) % LINES.length;
    type(LINES[idx]);
  });
  type(LINES[idx]);
})();
</script>
<script src="assets/away.js"></script>
</body>
</html>
