<body>
<main>
  <h1>404</h1>
  <p>there's nothing here.</p>
  <p id="late"></p>
  <p><a href="/">back to the lobby</a></p>
</main>
<script>
(() => {
  const late = document.getElementById('late');
  const LINES = [
    [6000, "...you're still here?"],
    [14000, "there's really nothing. i checked."],
    [26000, 'ok this is kind of nice actually.'],
    [45000, "i'll leave the light on for you."],
  ];
  for (const [ms, text] of LINES) setTimeout(() => { late.textContent = text; }, ms);
})();
</script>
